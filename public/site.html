<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NetSearch İşletme</title>
<meta name="description" content="NetSearch işletme detay sayfası">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}

body{
  background:#020817;
  color:white;
  min-height:100vh;
}

.header{
  padding:20px 40px;
  background:#0f172a;
  border-bottom:1px solid #1e293b;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.brand{
  font-size:28px;
  font-weight:bold;
  color:#38bdf8;
}

.header a{
  color:white;
  text-decoration:none;
  background:#2563eb;
  padding:10px 16px;
  border-radius:999px;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:40px 20px;
}

.hero{
  background:#0f172a;
  border:1px solid #1e293b;
  border-radius:24px;
  overflow:hidden;
}

.cover{
  width:100%;
  height:320px;
  object-fit:cover;
  background:#111827;
}

.content{
  padding:30px;
}

.top{
  display:flex;
  gap:20px;
  align-items:flex-start;
  flex-wrap:wrap;
}

.logo{
  width:90px;
  height:90px;
  border-radius:20px;
  object-fit:cover;
  border:1px solid #334155;
  background:#020817;
}

.title{
  font-size:34px;
  color:#38bdf8;
  margin-bottom:10px;
}

.badge{
  display:inline-block;
  margin-right:8px;
  margin-top:8px;
  padding:7px 13px;
  border-radius:999px;
  background:#1e293b;
  color:#38bdf8;
  font-size:14px;
}

.rating{
  background:#ca8a04;
  color:white;
}

.sponsor{
  background:#9333ea;
  color:white;
}

.info{
  margin-top:20px;
  line-height:1.8;
  color:#cbd5e1;
}

.actions{
  margin-top:25px;
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

.btn{
  border:none;
  border-radius:999px;
  padding:12px 18px;
  cursor:pointer;
  color:white;
  text-decoration:none;
  background:#2563eb;
}

.green{background:#16a34a}
.orange{background:#ea580c}

.reviewSection{
  margin-top:35px;
  background:#0f172a;
  border:1px solid #1e293b;
  border-radius:24px;
  padding:25px;
}

.review{
  border-top:1px solid #1e293b;
  padding-top:15px;
  margin-top:15px;
  color:#cbd5e1;
}

.reviewForm{
  margin-top:25px;
  display:grid;
  gap:12px;
}

.reviewForm input,
.reviewForm textarea,
.reviewForm select{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid #334155;
  background:#020817;
  color:white;
}

.reviewForm textarea{
  min-height:100px;
}

.reviewForm button{
  border:none;
  padding:14px;
  border-radius:12px;
  background:#16a34a;
  color:white;
  cursor:pointer;
}

@media(max-width:700px){

  .header{
    padding:18px;
    flex-direction:column;
    gap:15px;
  }

  .title{
    font-size:28px;
  }

  .cover{
    height:220px;
  }
}
</style>
</head>

<body>

<div class="header">
  <div class="brand">NetSearch AI</div>
  <a href="/">Ana Sayfa</a>
</div>

<div class="container">

  <div class="hero">

    <img id="cover" class="cover">

    <div class="content">

      <div class="top">

        <img id="logo" class="logo">

        <div>

          <div id="title" class="title"></div>

          <div id="badges"></div>

        </div>

      </div>

      <div class="info" id="info"></div>

      <div class="actions">

        <a id="visitBtn" class="btn green" target="_blank">
          Siteye Git
        </a>

        <button class="btn" onclick="googleSearch()">
          Google’da Ara
        </button>

        <button class="btn orange" onclick="scrollReviews()">
          Yorumlar
        </button>

      </div>

    </div>

  </div>

  <div class="reviewSection" id="reviewSection">

    <h2>Yorumlar</h2>

    <div id="reviews"></div>

    <div class="reviewForm">

      <input id="reviewName" placeholder="Adınız">

      <select id="reviewRating">
        <option value="5">5 Yıldız</option>
        <option value="4">4 Yıldız</option>
        <option value="3">3 Yıldız</option>
        <option value="2">2 Yıldız</option>
        <option value="1">1 Yıldız</option>
      </select>

      <textarea id="reviewComment" placeholder="Yorumunuzu yazın"></textarea>

      <button onclick="sendReview()">
        Yorumu Gönder
      </button>

    </div>

  </div>

</div>

<script>
const params = new URLSearchParams(location.search);

const siteId = params.get("id");

let siteData = null;

async function loadSite(){

  const res = await fetch(`/api/sites/${siteId}`);
  const site = await res.json();

  siteData = site;

  document.title = site.seoTitle || site.title;

  document.querySelector('meta[name="description"]').setAttribute(
    "content",
    site.seoDescription || site.desc || ""
  );

  document.getElementById("cover").src =
    site.imageUrl || "https://via.placeholder.com/1200x400.png?text=NetSearch";

  document.getElementById("logo").src =
    site.logoUrl || "https://via.placeholder.com/200x200.png?text=NS";

  document.getElementById("title").innerText =
    site.title || "İşletme";

  document.getElementById("visitBtn").href =
    site.url;

  document.getElementById("badges").innerHTML = `
    <span class="badge">${site.category || "Genel"}</span>

    ${site.adActive
      ? `<span class="badge sponsor">Sponsorlu</span>`
      : ""
    }

    ${site.city || site.district
      ? `<span class="badge">📍 ${site.city || ""} ${site.district || ""}</span>`
      : ""
    }

    ${site.phone
      ? `<span class="badge">📞 ${site.phone}</span>`
      : ""
    }
  `;

  document.getElementById("info").innerHTML = `
    <p><b>Açıklama:</b> ${site.desc || "-"}</p>

    <p><b>Adres:</b> ${site.address || "-"}</p>

    <p><b>Anahtar Kelimeler:</b> ${site.keywords || "-"}</p>

    <p><b>Görüntülenme:</b> ${site.views || 0}</p>

    <p><b>Tıklama:</b> ${site.clicks || 0}</p>
  `;

  loadReviews();
}

function stars(rating){

  const n = Math.round(Number(rating || 5));

  return "★".repeat(n) + "☆".repeat(5 - n);
}

async function loadReviews(){

  const res = await fetch(`/api/sites/${siteId}/reviews`);

  const reviews = await res.json();

  const box = document.getElementById("reviews");

  box.innerHTML = "";

  if(reviews.length === 0){

    box.innerHTML = `
      <p style="margin-top:20px;color:#94a3b8">
        Henüz yorum yok.
      </p>
    `;

    return;
  }

  reviews.forEach(review => {

    box.innerHTML += `
      <div class="review">

        <b>${review.userName || "Ziyaretçi"}</b>

        <div style="color:#facc15;margin-top:5px">
          ${stars(review.rating)}
        </div>

        <p style="margin-top:10px">
          ${review.comment}
        </p>

      </div>
    `;
  });
}

async function sendReview(){

  const userName =
    document.getElementById("reviewName").value.trim();

  const rating =
    document.getElementById("reviewRating").value;

  const comment =
    document.getElementById("reviewComment").value.trim();

  if(!comment){
    alert("Yorum yaz.");
    return;
  }

  const res = await fetch(`/api/sites/${siteId}/reviews`, {
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },
    body:JSON.stringify({
      userName:userName || "Ziyaretçi",
      rating,
      comment
    })
  });

  const data = await res.json();

  alert(data.message || "Yorum gönderildi.");

  document.getElementById("reviewComment").value = "";

  loadReviews();
}

function googleSearch(){

  if(!siteData) return;

  const q = encodeURIComponent(
    siteData.title + " yorumları güvenilir mi"
  );

  window.open(
    `https://www.google.com/search?q=${q}`,
    "_blank"
  );
}

function scrollReviews(){

  document.getElementById("reviewSection")
    .scrollIntoView({
      behavior:"smooth"
    });
}

loadSite();
</script>

</body>
</html>
