<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NetSearch İşletme Detayı</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#020817;color:white;min-height:100vh}
.header{background:#0f172a;border-bottom:1px solid #1e293b;padding:20px 35px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:30px;font-weight:bold;color:#38bdf8}
.btn{border:none;border-radius:999px;padding:13px 20px;cursor:pointer;color:white;text-decoration:none;display:inline-block;font-size:15px}
.blue{background:#2563eb}.green{background:#16a34a}.orange{background:#ea580c}.purple{background:#9333ea}
.container{max-width:1100px;margin:45px auto;padding:0 20px}
.card,.reviewsBox{background:#0f172a;border:1px solid #1e293b;border-radius:28px;overflow:hidden;margin-bottom:30px}
.cover{width:100%;max-height:360px;object-fit:cover;background:#111827}
.content{padding:30px}
.top{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap}
.logoBox{width:90px;height:90px;border-radius:20px;overflow:hidden;background:linear-gradient(135deg,#0ea5e9,#2563eb);display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:bold}
.logoBox img{width:100%;height:100%;object-fit:cover}
h1{color:#38bdf8;font-size:36px;margin-bottom:10px}
.badge{display:inline-block;background:#1e293b;color:#38bdf8;padding:8px 14px;border-radius:999px;margin:5px 6px 5px 0;font-size:14px}
.desc{color:#e5e7eb;line-height:1.8;margin-top:22px;font-size:17px}
.info{margin-top:18px;color:#cbd5e1;line-height:1.8}
.info b{color:white}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.callBtn{background:#16a34a;font-weight:bold}
.whatsappBtn{background:#22c55e;font-weight:bold}
.siteBtn{background:#2563eb;font-weight:bold}
.webBtn{background:#9333ea}
.reviewBtn{background:#ea580c}
.reviewsBox{padding:28px}
.reviewsBox h2{color:#38bdf8;margin-bottom:18px}
.review{background:#111827;border:1px solid #1e293b;border-radius:18px;padding:16px;margin-bottom:14px}
.review b{color:#38bdf8}
.review p{color:#cbd5e1;margin-top:8px;line-height:1.6}
input,textarea,select{width:100%;padding:14px;background:#020817;border:1px solid #334155;border-radius:14px;color:white;margin-bottom:12px}
textarea{min-height:100px}
.empty{color:#94a3b8}
@media(max-width:700px){
.header{flex-direction:column;gap:14px}
h1{font-size:28px}
.content{padding:22px}
.actions .btn{width:100%;text-align:center}
}
</style>
</head>

<body>

<div class="header">
  <div class="logo">NetSearch AI</div>
  <a class="btn blue" href="/">Ana Sayfa</a>
</div>

<div class="container">

  <div id="siteDetail"></div>

  <div class="reviewsBox">
    <h2>Yorumlar</h2>
    <div id="reviews"></div>

    <h2 style="margin-top:28px">Yorum Yap</h2>
    <input id="userName" placeholder="Adınız">
    <select id="rating">
      <option value="5">5 Yıldız</option>
      <option value="4">4 Yıldız</option>
      <option value="3">3 Yıldız</option>
      <option value="2">2 Yıldız</option>
      <option value="1">1 Yıldız</option>
    </select>
    <textarea id="comment" placeholder="Yorumunuzu yazın"></textarea>
    <button class="btn orange" onclick="addReview()">Yorumu Gönder</button>
  </div>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const siteId = params.get("id");

let currentSite = null;

function letterLogo(title){
  return (title || "N").charAt(0).toUpperCase();
}

function cleanPhone(phone){
  return (phone || "").replaceAll(" ","").replaceAll("-","").replaceAll("(","").replaceAll(")","");
}

function whatsappLink(phone){
  const cleaned = cleanPhone(phone);
  if(!cleaned) return "#";

  let number = cleaned;

  if(number.startsWith("0")){
    number = "90" + number.substring(1);
  }

  if(!number.startsWith("90")){
    number = "90" + number;
  }

  return `https://wa.me/${number}`;
}

function googleSearch(title){
  const q = encodeURIComponent(title);
  window.open(`https://www.google.com/search?q=${q}`, "_blank");
}

async function registerClick(){
  try{
    await fetch(`/api/sites/${siteId}/click`, { method:"POST" });
  }catch(err){}
}

async function loadSite(){
  const box = document.getElementById("siteDetail");

  if(!siteId){
    box.innerHTML = `<div class="card"><div class="content">Site bulunamadı.</div></div>`;
    return;
  }

  const res = await fetch(`/api/sites/${siteId}`);
  const site = await res.json();

  currentSite = site;

  if(site.message){
    box.innerHTML = `<div class="card"><div class="content">Site bulunamadı.</div></div>`;
    return;
  }

  document.title = `${site.title} - NetSearch AI`;

  fetch(`/api/sites/${siteId}/view`, { method:"POST" });

  const phone = cleanPhone(site.phone);
  const hasPhone = phone.length > 0;
  const hasCover = site.imageUrl && site.imageUrl.trim() !== "";

  box.innerHTML = `
    <div class="card">

      ${hasCover ? `<img class="cover" src="${site.imageUrl}" onerror="this.style.display='none'">` : ""}

      <div class="content">

        <div class="top">
          <div class="logoBox">
            ${site.logoUrl ? `<img src="${site.logoUrl}" onerror="this.parentElement.innerHTML='${letterLogo(site.title)}'">` : letterLogo(site.title)}
          </div>

          <div>
            <h1>${site.title || ""}</h1>

            <span class="badge">${site.category || "Genel"}</span>
            ${site.city ? `<span class="badge">📍 ${site.city}</span>` : ""}
            ${site.district ? `<span class="badge">${site.district}</span>` : ""}
            ${hasPhone ? `<span class="badge">📞 ${site.phone}</span>` : ""}
          </div>
        </div>

        <div class="desc">
          ${site.desc || ""}
        </div>

        <div class="info">
          ${site.address ? `<p><b>Adres:</b> ${site.address}</p>` : ""}
          ${site.keywords ? `<p><b>Hizmetler:</b> ${site.keywords}</p>` : ""}
        </div>

        <div class="actions">

          ${hasPhone ? `
            <a class="btn callBtn" href="tel:${phone}" onclick="registerClick()">
              📞 Hemen Ara
            </a>
          ` : ""}

          ${hasPhone ? `
            <a class="btn whatsappBtn" href="${whatsappLink(site.phone)}" target="_blank" onclick="registerClick()">
              WhatsApp
            </a>
          ` : ""}

          <a class="btn siteBtn" href="${site.url}" target="_blank" onclick="registerClick()">
            Siteye Git
          </a>

          <button class="btn webBtn" onclick="googleSearch('${(site.title || "").replace(/'/g,"\\'")}')">
            Web’de Ara
          </button>

          <a class="btn reviewBtn" href="#reviews">
            Yorumlar
          </a>

        </div>

      </div>
    </div>
  `;
}

async function loadReviews(){
  const box = document.getElementById("reviews");
  const res = await fetch(`/api/sites/${siteId}/reviews`);
  const reviews = await res.json();

  if(!reviews || reviews.length === 0){
    box.innerHTML = `<p class="empty">Henüz yorum yok.</p>`;
    return;
  }

  box.innerHTML = reviews.map(r => `
    <div class="review">
      <b>${r.userName || "Ziyaretçi"}</b> ⭐ ${r.rating || 5}
      <p>${r.comment}</p>
    </div>
  `).join("");
}

async function addReview(){
  const userName = document.getElementById("userName").value.trim();
  const rating = document.getElementById("rating").value;
  const comment = document.getElementById("comment").value.trim();

  if(!comment){
    alert("Yorum boş olamaz.");
    return;
  }

  const res = await fetch(`/api/sites/${siteId}/reviews`, {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({
      userName:userName || "Ziyaretçi",
      rating,
      comment
    })
  });

  const data = await res.json();
  alert(data.message || "Yorum eklendi.");

  document.getElementById("comment").value = "";
  loadReviews();
}

loadSite();
loadReviews();
</script>

</body>
</html>
