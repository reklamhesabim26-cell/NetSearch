<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NetSearch İşletme Detayı</title>
<meta name="description" content="NetSearch işletme detay sayfası">

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#eef6ff;color:#0f172a}
header{background:linear-gradient(135deg,#e0f2fe,#ffffff,#dbeafe);padding:22px;border-bottom:1px solid #dbeafe}
.top{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:30px;font-weight:900}
.logo span{color:#0284c7}
.top a{text-decoration:none;background:white;border:1px solid #bae6fd;color:#0369a1;padding:10px 16px;border-radius:999px;font-weight:bold}
.wrap{max-width:1100px;margin:auto;padding:24px 16px 60px}
.hero{background:white;border:1px solid #dbeafe;border-radius:28px;overflow:hidden;box-shadow:0 20px 60px rgba(15,23,42,.08)}
.cover{width:100%;height:300px;object-fit:cover;background:#dbeafe}
.content{padding:24px}
.head{display:flex;gap:18px;align-items:center}
.siteLogo{width:90px;height:90px;object-fit:cover;border-radius:24px;background:#e0f2fe;border:1px solid #dbeafe}
h1{margin:0 0 8px;color:#0284c7;font-size:34px}
.url{color:#16a34a;font-weight:bold;word-break:break-all}
.desc{margin:22px 0;color:#334155;line-height:1.7;font-size:17px}
.badges{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
.badge{background:#f8fbff;border:1px solid #bae6fd;color:#0369a1;border-radius:999px;padding:9px 13px;font-weight:bold;font-size:14px}
.verified{background:#dcfce7;border-color:#86efac;color:#166534}
.sponsored{background:#fef3c7;border-color:#f59e0b;color:#92400e}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.actions a,.actions button{border:0;text-decoration:none;color:white;padding:13px 18px;border-radius:999px;font-weight:bold;cursor:pointer}
.visit{background:#16a34a}.call{background:#0f766e}.whatsapp{background:#22c55e}.share{background:#9333ea}.back{background:#2563eb}
.section{background:white;border:1px solid #dbeafe;border-radius:24px;padding:22px;margin-top:22px;box-shadow:0 16px 45px rgba(15,23,42,.06)}
.section h2{margin-top:0;color:#0284c7}
.slider{position:relative;overflow:hidden;border-radius:22px;background:#f1f5f9}
.slider img{width:100%;height:380px;object-fit:cover;display:block}
.sliderBtns{display:flex;justify-content:center;gap:10px;margin-top:12px}
.sliderBtns button{border:0;background:#2563eb;color:white;border-radius:12px;padding:10px 16px;cursor:pointer;font-weight:bold}
.mapBox{background:#f8fbff;border:1px dashed #bae6fd;border-radius:20px;padding:22px;color:#475569;line-height:1.6}
.mapFrame{width:100%;height:360px;border:0;border-radius:18px;margin-top:14px}
.commentForm{display:grid;gap:10px}
input,textarea,select{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:12px;font-size:15px}
textarea{min-height:90px}
.commentForm button{background:#16a34a;color:white;border:0;padding:13px;border-radius:12px;font-weight:bold;cursor:pointer}
.comment{border-top:1px solid #e2e8f0;padding:14px 0}
.comment b{color:#0284c7}
.related{display:grid;gap:14px}
.relatedCard{border:1px solid #dbeafe;background:#f8fbff;border-radius:18px;padding:14px}
.relatedCard h3{margin:0 0 6px;color:#0284c7}
.empty{text-align:center;color:#64748b;padding:50px;font-size:20px}

@media(max-width:700px){
  .top,.head{flex-direction:column;align-items:flex-start}
  .cover{height:200px}
  h1{font-size:26px}
  .slider img{height:220px}
  .mapFrame{height:260px}
  .actions a,.actions button{width:100%;text-align:center}
}
</style>
</head>

<body>

<header>
  <div class="top">
    <div class="logo">Net<span>Search</span></div>
    <a href="/index.html">Ana Sayfa</a>
  </div>
</header>

<div class="wrap" id="app">
  <div class="empty">Yükleniyor...</div>
</div>

<script>
const API = "";
const params = new URLSearchParams(window.location.search);
const siteId = params.get("id");

let currentSite = null;
let galleryImages = [];
let currentSlide = 0;

window.onload = loadSite;

async function loadSite(){
  const app = document.getElementById("app");

  if(!siteId){
    app.innerHTML = `<div class="empty">Site ID bulunamadı.</div>`;
    return;
  }

  try{
    const res = await fetch(`${API}/api/sites/${siteId}?t=${Date.now()}`, {cache:"no-store"});
    const data = await res.json();

    currentSite = data.site || data;

    if(!currentSite || !currentSite._id){
      app.innerHTML = `<div class="empty">İşletme bulunamadı.</div>`;
      return;
    }

    renderSite(data.comments || []);
    loadRelated();

  }catch(err){
    console.log(err);
    app.innerHTML = `<div class="empty">Sunucuya bağlanılamadı.</div>`;
  }
}

function renderSite(comments){
  const app = document.getElementById("app");

  const title = currentSite.title || currentSite.name || currentSite.businessName || "İsimsiz İşletme";
  const url = currentSite.url || currentSite.website || currentSite.link || "#";
  const desc = currentSite.description || currentSite.desc || currentSite.address || "Açıklama bulunamadı.";
  const logo = currentSite.logo || currentSite.logoUrl || currentSite.image || "https://via.placeholder.com/120x120.png?text=NS";
  const cover = currentSite.cover || currentSite.coverUrl || currentSite.image || "https://via.placeholder.com/1200x400.png?text=NetSearch";
  const category = currentSite.category || "Genel";
  const city = currentSite.city || currentSite.sehir || "";
  const district = currentSite.district || currentSite.ilce || "";
  const address = currentSite.address || "";
  const phone = currentSite.phone || currentSite.telefon || "";
  const whatsapp = currentSite.whatsapp || phone;
  const verified = currentSite.verified || currentSite.isVerified;
  const sponsored = currentSite.sponsored || currentSite.isSponsored || currentSite.sponsorActive;

  const mapQuery = encodeURIComponent(`${address} ${city} ${district}`);

  galleryImages = Array.isArray(currentSite.gallery) && currentSite.gallery.length ? currentSite.gallery : [cover];

  document.title = `${title} - NetSearch`;
  document.querySelector("meta[name='description']").setAttribute("content", desc);

  app.innerHTML = `
    <div class="hero">
      <img class="cover" src="${escapeHtml(cover)}" onerror="this.src='https://via.placeholder.com/1200x400.png?text=NetSearch'">

      <div class="content">
        <div class="head">
          <img class="siteLogo" src="${escapeHtml(logo)}" onerror="this.src='https://via.placeholder.com/120x120.png?text=NS'">
          <div>
            <h1>${escapeHtml(title)}</h1>
            <div class="url">${escapeHtml(url)}</div>
          </div>
        </div>

        <p class="desc">${escapeHtml(desc)}</p>

        <div class="badges">
          ${verified ? `<span class="badge verified">✅ Doğrulanmış İşletme</span>` : `<span class="badge">Doğrulama Bekliyor</span>`}
          ${sponsored ? `<span class="badge sponsored">⭐ Sponsorlu İşletme</span>` : `<span class="badge">Organik Sonuç</span>`}
          <span class="badge">${escapeHtml(category)}</span>
          ${city ? `<span class="badge">📍 ${escapeHtml(city)}${district ? " / " + escapeHtml(district) : ""}</span>` : ""}
          ${currentSite.rating ? `<span class="badge">⭐ ${currentSite.rating}</span>` : ""}
        </div>

        <div class="actions">
          <a class="visit" href="${escapeHtml(url)}" target="_blank" onclick="trackClick()">Siteye Git</a>
          ${phone ? `<a class="call" href="tel:${cleanPhone(phone)}">Ara</a>` : ""}
          ${whatsapp ? `<a class="whatsapp" href="https://wa.me/${cleanPhone(whatsapp)}" target="_blank">WhatsApp</a>` : ""}
          <button class="share" onclick="shareSite('${escapeAttr(title)}','${escapeAttr(url)}')">Paylaş</button>
          <a class="back" href="/index.html">Aramaya Dön</a>
        </div>
      </div>
    </div>

    <div class="section">
      <h2>Galeri</h2>
      <div class="slider">
        <img id="sliderImg" src="${escapeHtml(galleryImages[0])}" onerror="this.src='https://via.placeholder.com/1200x400.png?text=NetSearch'">
      </div>
      <div class="sliderBtns">
        <button onclick="prevSlide()">Önceki</button>
        <button onclick="nextSlide()">Sonraki</button>
      </div>
    </div>

    <div class="section">
      <h2>Konum / Harita</h2>
      <div class="mapBox">
        <b>Adres:</b><br>
        ${escapeHtml(address || "Adres bilgisi eklenmemiş.")}
        <br><br>

        ${address || city ? `
          <iframe
            class="mapFrame"
            loading="lazy"
            src="https://www.openstreetmap.org/export/embed.html?bbox=26.0,39.0,31.0,41.5&layer=mapnik&marker=39.7767,30.5206">
          </iframe>
          <br><br>
          <a target="_blank" href="https://www.google.com/maps/search/${mapQuery}">
            Google Haritalar’da Aç
          </a>
        ` : `Harita için adres bilgisi eklenmemiş.`}
      </div>
    </div>

    <div class="section">
      <h2>Yorum Yap</h2>
      <div class="commentForm">
        <input id="commentName" placeholder="Adınız">
        <select id="commentRating">
          <option value="5">5 Yıldız</option>
          <option value="4">4 Yıldız</option>
          <option value="3">3 Yıldız</option>
          <option value="2">2 Yıldız</option>
          <option value="1">1 Yıldız</option>
        </select>
        <textarea id="commentText" placeholder="Yorumunuz"></textarea>
        <button onclick="sendComment()">Yorum Gönder</button>
      </div>
    </div>

    <div class="section">
      <h2>Yorumlar</h2>
      <div id="comments">${renderComments(comments)}</div>
    </div>

    <div class="section">
      <h2>Benzer İşletmeler</h2>
      <div id="related" class="related">Yükleniyor...</div>
    </div>
  `;
}

function renderComments(comments){
  if(!comments || comments.length === 0){
    return `<p>Henüz yorum yok.</p>`;
  }

  return comments.map(c => `
    <div class="comment">
      <b>${escapeHtml(c.name || "Misafir")}</b> - ⭐ ${c.rating || 5}
      <p>${escapeHtml(c.comment || "")}</p>
    </div>
  `).join("");
}

function nextSlide(){
  if(!galleryImages.length) return;
  currentSlide = (currentSlide + 1) % galleryImages.length;
  document.getElementById("sliderImg").src = galleryImages[currentSlide];
}

function prevSlide(){
  if(!galleryImages.length) return;
  currentSlide = (currentSlide - 1 + galleryImages.length) % galleryImages.length;
  document.getElementById("sliderImg").src = galleryImages[currentSlide];
}

async function sendComment(){
  const name = document.getElementById("commentName").value.trim();
  const rating = document.getElementById("commentRating").value;
  const comment = document.getElementById("commentText").value.trim();

  if(!comment){
    alert("Yorum yaz.");
    return;
  }

  try{
    const res = await fetch(`${API}/api/comments`,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({siteId,name,rating,comment})
    });

    const data = await res.json();

    if(data.success){
      alert("Yorum eklendi.");
      loadSite();
    }else{
      alert("Yorum eklenemedi.");
    }
  }catch{
    alert("Sunucuya bağlanılamadı.");
  }
}

async function loadRelated(){
  try{
    const q = currentSite.category || currentSite.city || currentSite.sehir || "";
    const res = await fetch(`${API}/api/sites?q=${encodeURIComponent(q)}&t=${Date.now()}`, {cache:"no-store"});
    const sites = await res.json();

    const related = sites.filter(s => s._id !== currentSite._id).slice(0,4);
    const box = document.getElementById("related");

    if(!related.length){
      box.innerHTML = "Benzer işletme bulunamadı.";
      return;
    }

    box.innerHTML = related.map(site => `
      <div class="relatedCard">
        <h3>${escapeHtml(site.title || site.name || site.businessName || "İsimsiz")}</h3>
        <p>${escapeHtml(site.description || site.desc || "")}</p>
        <a href="/site.html?id=${site._id}">Detay Sayfası</a>
      </div>
    `).join("");

  }catch{
    document.getElementById("related").innerHTML = "Benzer işletmeler alınamadı.";
  }
}

async function trackClick(){
  try{
    await fetch(`${API}/api/sites/${siteId}/click`, {method:"POST"});
  }catch{}
}

function shareSite(title,url){
  if(navigator.share){
    navigator.share({title,url});
  }else{
    navigator.clipboard.writeText(url);
    alert("Link kopyalandı.");
  }
}

function cleanPhone(phone){
  let p = String(phone || "").replace(/\D/g,"");
  if(p.startsWith("0")) p = "90" + p.slice(1);
  if(!p.startsWith("90") && p.length === 10) p = "90" + p;
  return p;
}

function escapeHtml(text){
  return String(text || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function escapeAttr(text){
  return String(text || "")
    .replaceAll("\\","\\\\")
    .replaceAll("'","\\'")
    .replaceAll('"',"&quot;");
}
</script>

</body>
</html>
