<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NetSearch İşletme Detayı</title>

<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="manifest" href="/manifest.json">

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f9ff;color:#0f172a}
header{background:white;border-bottom:1px solid #dbeafe;padding:16px 22px}
.top{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:28px;font-weight:900}.logo span{color:#0ea5e9}
a,button{text-decoration:none;border:0;border-radius:12px;padding:11px 15px;font-weight:bold;cursor:pointer}
.blue{background:#2563eb;color:white}.green{background:#16a34a;color:white}.dark{background:#0f172a;color:white}.purple{background:#9333ea;color:white}
.wrap{max-width:1100px;margin:auto;padding:22px}
.card{background:white;border:1px solid #dbeafe;border-radius:24px;padding:20px;margin-bottom:18px;box-shadow:0 14px 38px rgba(15,23,42,.07)}
.cover{width:100%;height:260px;object-fit:cover;border-radius:20px;background:#e0f2fe}
.head{display:flex;gap:16px;align-items:center;margin-top:-42px;padding:0 14px}
.siteLogo,.logoLetter{width:86px;height:86px;border-radius:22px;border:4px solid white;background:#e0f2fe;object-fit:cover}
.logoLetter{display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900;color:#0284c7}
h1{margin:8px 0 4px;font-size:32px;color:#0284c7}
.url{color:#16a34a;font-weight:bold;word-break:break-all}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.badge{background:#f8fafc;border:1px solid #dbeafe;color:#0369a1;border-radius:999px;padding:8px 11px;font-size:13px;font-weight:bold}
.verified{background:#dcfce7;border-color:#86efac;color:#166534}
.desc{line-height:1.7;color:#334155;font-size:16px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.actions a,.actions button{color:white}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.gallery img{width:100%;height:140px;object-fit:cover;border-radius:16px;border:1px solid #dbeafe;background:white}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.mapBox{height:280px;border-radius:18px;border:1px solid #dbeafe;overflow:hidden;background:#e0f2fe}
.mapBox iframe{width:100%;height:100%;border:0}
input,textarea,select{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:13px;margin-bottom:10px;font-size:15px}
textarea{min-height:90px}
.comment{border:1px solid #dbeafe;background:#f8fbff;border-radius:16px;padding:14px;margin-top:10px}
.comment b{color:#0284c7}
.loading,.empty{text-align:center;padding:35px;color:#64748b;font-weight:bold}
footer{background:#f8fafc;border-top:1px solid #e5e7eb;padding:18px;text-align:center;color:#64748b}
@media(max-width:700px){
  .top{flex-direction:column;align-items:flex-start;gap:10px}
  .cover{height:170px}
  .head{margin-top:-34px}
  h1{font-size:25px}
  .actions a,.actions button{width:100%;text-align:center}
}
</style>
</head>

<body>

<header>
  <div class="top">
    <div class="logo">Net<span>Search</span></div>
    <a class="blue" href="/index.html">Ana Sayfa</a>
  </div>
</header>

<div class="wrap">

  <div id="content" class="loading">İşletme yükleniyor...</div>

</div>

<footer>© 2026 NetSearch</footer>

<script>
let currentSite=null;

window.onload=loadSite;

function getId(){
  const params=new URLSearchParams(location.search);
  if(params.get("id")) return params.get("id");

  const parts=location.pathname.split("/").filter(Boolean);
  if(parts[0]==="site" && parts[1]) return parts[1];

  return "";
}

async function loadSite(){
  const id=getId();
  const content=document.getElementById("content");

  if(!id){
    content.innerHTML="<div class='empty'>İşletme bulunamadı.</div>";
    return;
  }

  try{
    const res=await fetch("/api/sites/"+id+"?t="+Date.now(),{cache:"no-store"});
    const data=await res.json();

    if(!data.site){
      content.innerHTML="<div class='empty'>İşletme bulunamadı.</div>";
      return;
    }

    currentSite=data.site;
    renderSite(data.site,data.comments||[]);
  }catch{
    content.innerHTML="<div class='empty'>Sunucuya bağlanılamadı.</div>";
  }
}

function renderSite(site,comments){
  const title=site.title||site.name||site.businessName||"İşletme";
  const url=site.url||site.website||site.link||"#";
  const desc=site.description||site.desc||site.adDescription1||"Açıklama bulunmuyor.";
  const logo=site.logo||site.logoUrl||site.image||"";
  const cover=site.cover||site.coverUrl||"";
  const gallery=Array.isArray(site.gallery)?site.gallery:[];
  const phone=site.phone||site.telefon||"";
  const whatsapp=site.whatsapp||phone;
  const city=site.city||site.sehir||"";
  const district=site.district||site.ilce||"";
  const category=site.category||"Genel";
  const verified=site.verified||site.isVerified;
  const first=title.charAt(0).toUpperCase()||"N";
  const lat=Number(site.latitude||0);
  const lng=Number(site.longitude||0);

  document.title=title+" - NetSearch";

  document.getElementById("content").innerHTML=`
    <div class="card">
      ${cover ? `<img class="cover" src="${esc(cover)}">` : `<div class="cover"></div>`}

      <div class="head">
        ${
          logo
          ? `<img class="siteLogo" src="${esc(logo)}" onerror="this.outerHTML='<div class=&quot;logoLetter&quot;>${esc(first)}</div>'">`
          : `<div class="logoLetter">${esc(first)}</div>`
        }

        <div>
          <h1>${esc(title)}</h1>
          <div class="url">${esc(url)}</div>
        </div>
      </div>

      <div class="badges">
        ${verified ? `<span class="badge verified">✅ Doğrulanmış İşletme</span>` : ""}
        <span class="badge">${esc(category)}</span>
        ${city ? `<span class="badge">📍 ${esc(city)}${district ? " / "+esc(district) : ""}</span>` : ""}
        <span class="badge">👁️ ${site.views||0} görüntüleme</span>
        <span class="badge">🖱️ ${site.clicks||0} tıklama</span>
        ${site.qualityScore ? `<span class="badge">Kalite: ${site.qualityScore}</span>` : ""}
      </div>

      <p class="desc">${esc(desc)}</p>

      <div class="actions">
        <a class="green" href="${esc(url)}" target="_blank" onclick="trackClick('${site._id}')">Siteye Git</a>
        ${phone ? `<a class="dark" href="tel:${cleanPhone(phone)}">Ara</a>` : ""}
        ${whatsapp ? `<a class="green" href="https://wa.me/${cleanPhone(whatsapp)}" target="_blank">WhatsApp</a>` : ""}
        <button class="purple" onclick="shareSite('${escAttr(title)}','${escAttr(url)}')">Paylaş</button>
      </div>
    </div>

    ${gallery.length ? `
      <div class="card">
        <h2>Galeri</h2>
        <div class="gallery">
          ${gallery.map(img=>`<img src="${esc(img)}">`).join("")}
        </div>
      </div>
    ` : ""}

    <div class="grid">
      <div class="card">
        <h2>Harita</h2>
        ${
          lat && lng
          ? `<div class="mapBox"><iframe loading="lazy" src="https://maps.google.com/maps?q=${lat},${lng}&z=15&output=embed"></iframe></div>`
          : `<div class="empty">Bu işletme için harita konumu eklenmemiş.</div>`
        }
      </div>

      <div class="card">
        <h2>NetSearch AI Özeti</h2>
        <p class="desc">
          ${esc(title)} için NetSearch kayıtlarında bulunan açıklama, kategori ve konum bilgileri özetlenmiştir.
          Detaylı bilgi için işletmenin web sitesini ziyaret edebilir veya doğrudan iletişime geçebilirsiniz.
        </p>
      </div>
    </div>

    <div class="card">
      <h2>Yorum Yap</h2>
      <input id="commentName" placeholder="Adınız">
      <select id="commentRating">
        <option value="5">5 Yıldız</option>
        <option value="4">4 Yıldız</option>
        <option value="3">3 Yıldız</option>
        <option value="2">2 Yıldız</option>
        <option value="1">1 Yıldız</option>
      </select>
      <textarea id="commentText" placeholder="Yorumunuzu yazın"></textarea>
      <button class="blue" onclick="sendComment()">Yorumu Gönder</button>
      <div id="commentMsg"></div>
    </div>

    <div class="card">
      <h2>Yorumlar</h2>
      <div id="commentsArea">
        ${
          comments.length
          ? comments.map(c=>`
            <div class="comment">
              <b>${esc(c.name||"Misafir")}</b> - ⭐ ${c.rating||5}<br>
              ${esc(c.comment||"")}
            </div>
          `).join("")
          : `<div class="empty">Henüz yorum yok.</div>`
        }
      </div>
    </div>
  `;
}

async function sendComment(){
  const name=document.getElementById("commentName").value.trim()||"Misafir";
  const rating=Number(document.getElementById("commentRating").value||5);
  const comment=document.getElementById("commentText").value.trim();
  const msg=document.getElementById("commentMsg");

  if(!comment){
    msg.innerHTML="<p style='color:#dc2626;font-weight:bold'>Yorum yazmalısınız.</p>";
    return;
  }

  try{
    const res=await fetch("/api/comments",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        siteId:currentSite._id,
        name,
        rating,
        comment
      })
    });

    const data=await res.json();

    if(data.success){
      msg.innerHTML="<p style='color:#16a34a;font-weight:bold'>Yorum gönderildi.</p>";
      loadSite();
    }else{
      msg.innerHTML="<p style='color:#dc2626;font-weight:bold'>Yorum gönderilemedi.</p>";
    }
  }catch{
    msg.innerHTML="<p style='color:#dc2626;font-weight:bold'>Sunucuya bağlanılamadı.</p>";
  }
}

async function trackClick(id){
  if(!id) return;
  try{
    await fetch(`/api/sites/${id}/click?t=${Date.now()}`,{
      method:"POST",
      cache:"no-store"
    });
  }catch{}
}

function shareSite(title,url){
  if(navigator.share){
    navigator.share({title,url});
  }else{
    navigator.clipboard.writeText(url);
    alert("Link kopyalandı.");
  }
}

function cleanPhone(phone){
  let p=String(phone||"").replace(/\D/g,"");
  if(p.startsWith("0")) p="90"+p.slice(1);
  if(!p.startsWith("90") && p.length===10) p="90"+p;
  return p;
}

function esc(t){
  return String(t||"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function escAttr(t){
  return String(t||"").replaceAll("'","\\'").replaceAll('"',"&quot;");
}
</script>

</body>
</html>
