<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NetSearch AI</title>

<meta name="description" content="Türkiye'nin yeni nesil yapay zeka destekli arama motoru">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#020817;
  color:white;
  min-height:100vh;
}

/* HEADER */

.header{
  width:100%;
  padding:20px 30px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #1e293b;
  background:#0f172a;
}

.logoText{
  font-size:34px;
  font-weight:bold;
  color:#38bdf8;
}

.headerButtons{
  display:flex;
  gap:10px;
}

.headerButtons a{
  text-decoration:none;
  color:white;
  background:#1e293b;
  padding:10px 18px;
  border-radius:999px;
  transition:.3s;
}

.headerButtons a:hover{
  background:#2563eb;
}

/* HERO */

.hero{
  width:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:70px 20px 30px;
}

.hero h1{
  font-size:90px;
  color:#38bdf8;
  margin-bottom:10px;
  text-align:center;
}

.hero p{
  font-size:28px;
  color:#cbd5e1;
  margin-bottom:40px;
  text-align:center;
}

/* SEARCH */

.searchBox{
  width:100%;
  max-width:900px;
  display:flex;
  background:#0f172a;
  border-radius:999px;
  overflow:hidden;
  border:2px solid #1e293b;
}

.searchBox input{
  flex:1;
  border:none;
  outline:none;
  padding:25px;
  font-size:22px;
  background:transparent;
  color:white;
}

.searchBox button{
  border:none;
  background:linear-gradient(90deg,#0ea5e9,#2563eb);
  color:white;
  width:180px;
  font-size:24px;
  cursor:pointer;
}

/* CATEGORY */

.categories{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  justify-content:center;
  margin-top:30px;
}

.categoryBtn{
  border:none;
  background:#0f172a;
  color:#38bdf8;
  padding:12px 20px;
  border-radius:999px;
  cursor:pointer;
  border:1px solid #1e293b;
  transition:.3s;
}

.categoryBtn:hover,
.categoryBtn.active{
  background:#2563eb;
  color:white;
}

/* RESULTS */

.results{
  width:100%;
  max-width:1200px;
  margin:40px auto;
  padding:0 20px;
}

.resultCard{
  background:#0f172a;
  border:1px solid #1e293b;
  border-radius:28px;
  overflow:hidden;
  margin-bottom:25px;
  transition:.3s;
}

.resultCard:hover{
  transform:translateY(-3px);
  border-color:#2563eb;
}

.cardCover{
  width:100%;
  height:230px;
  object-fit:cover;
  background:#111827;
}

.cardContent{
  padding:25px;
}

.topRow{
  display:flex;
  gap:18px;
  align-items:flex-start;
  flex-wrap:wrap;
}

.cardLogo{
  width:85px;
  height:85px;
  border-radius:20px;
  object-fit:cover;
  border:1px solid #334155;
  background:#020817;
}

.siteTitle{
  font-size:34px;
  color:#38bdf8;
  margin-bottom:10px;
}

.siteLink{
  color:#22c55e;
  margin-bottom:15px;
  display:block;
  text-decoration:none;
  word-break:break-all;
}

.siteDesc{
  color:#cbd5e1;
  line-height:1.7;
  margin-top:10px;
}

/* BADGES */

.badges{
  margin-top:15px;
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.badge{
  background:#1e293b;
  color:#38bdf8;
  padding:8px 14px;
  border-radius:999px;
  font-size:14px;
}

.sponsor{
  background:#9333ea;
  color:white;
}

.score{
  background:#0f766e;
  color:white;
}

.rating{
  background:#ca8a04;
  color:white;
}

/* BUTTONS */

.cardButtons{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  margin-top:25px;
}

.btn{
  text-decoration:none;
  border:none;
  cursor:pointer;
  padding:12px 18px;
  border-radius:999px;
  color:white;
  font-size:15px;
}

.btnBlue{
  background:#2563eb;
}

.btnGreen{
  background:#16a34a;
}

.btnPurple{
  background:#9333ea;
}

/* EMPTY */

.empty{
  text-align:center;
  padding:80px 20px;
  color:#94a3b8;
  font-size:24px;
}

/* MOBILE */

@media(max-width:700px){

  .hero h1{
    font-size:55px;
  }

  .hero p{
    font-size:20px;
  }

  .searchBox{
    flex-direction:column;
    border-radius:30px;
  }

  .searchBox input{
    width:100%;
    padding:20px;
    font-size:18px;
  }

  .searchBox button{
    width:100%;
    padding:20px;
  }

  .siteTitle{
    font-size:26px;
  }

  .cardCover{
    height:180px;
  }

  .header{
    flex-direction:column;
    gap:15px;
  }
}

</style>
</head>

<body>

<!-- HEADER -->

<div class="header">

  <div class="logoText">
    NetSearch
  </div>

  <div class="headerButtons">
    <a href="/login.html">Giriş Yap</a>
    <a href="/register.html">Kayıt Ol</a>
  </div>

</div>

<!-- HERO -->

<div class="hero">

  <h1>NetSearch</h1>

  <p>
    AI destekli sponsorlu ve organik arama motoru
  </p>

  <div class="searchBox">

    <input
      id="searchInput"
      placeholder="Kombi servisi, çiçekçi, market..."
    >

    <button onclick="searchSite()">
      Ara
    </button>

  </div>

  <!-- CATEGORY -->

  <div class="categories">

    <button class="categoryBtn active" onclick="setCategory('')">
      Tümü
    </button>

    <button class="categoryBtn" onclick="setCategory('Teknik Servis')">
      Teknik Servis
    </button>

    <button class="categoryBtn" onclick="setCategory('Çiçekçi')">
      Çiçekçi
    </button>

    <button class="categoryBtn" onclick="setCategory('Market')">
      Market
    </button>

    <button class="categoryBtn" onclick="setCategory('Resmi Kurum')">
      Resmi Kurum
    </button>

    <button class="categoryBtn" onclick="setCategory('Haber')">
      Haber
    </button>

  </div>

</div>

<!-- RESULTS -->

<div class="results" id="results"></div>

<script>

let sites = [];

let selectedCategory = "";

function setCategory(category){

  selectedCategory = category;

  document.querySelectorAll(".categoryBtn")
  .forEach(btn => btn.classList.remove("active"));

  event.target.classList.add("active");

  searchSite();
}

async function loadSites(){

  const res = await fetch("/api/sites");

  const data = await res.json();

  sites = data.filter(site => site.status === "approved");
}

function calculateAIScore(site,input){

  let score = 0;

  input = input.toLowerCase();

  const title =
    (site.title || "").toLowerCase();

  const keywords =
    (site.keywords || "").toLowerCase();

  const desc =
    (site.desc || "").toLowerCase();

  if(title.includes(input)) score += 40;

  if(keywords.includes(input)) score += 35;

  if(desc.includes(input)) score += 20;

  if(site.adActive) score += 15;

  score += Math.min(site.clicks || 0, 50);

  return score;
}

async function searchSite(){

  document.getElementById("searchInput").blur();

  await loadSites();

  const input =
    document.getElementById("searchInput")
    .value
    .toLowerCase()
    .trim();

  const resultsBox =
    document.getElementById("results");

  let filtered = sites.filter(site => {

    const text = `
      ${site.title}
      ${site.keywords}
      ${site.desc}
      ${site.category}
    `.toLowerCase();

    const searchMatch =
      !input || text.includes(input);

    const categoryMatch =
      !selectedCategory ||
      site.category === selectedCategory;

    return searchMatch && categoryMatch;
  });

  filtered = filtered.map(site => ({
    ...site,
    aiScore:calculateAIScore(site,input)
  }));

  filtered.sort((a,b) => b.aiScore - a.aiScore);

  resultsBox.innerHTML = "";

  if(filtered.length === 0){

    resultsBox.innerHTML = `
      <div class="empty">
        Sonuç bulunamadı.
      </div>
    `;

    return;
  }

  filtered.forEach(site => {

    resultsBox.innerHTML += `

      <div class="resultCard">

        <img
          class="cardCover"
          src="${
            site.imageUrl ||
            'https://via.placeholder.com/1200x400.png?text=NetSearch'
          }"
        >

        <div class="cardContent">

          <div class="topRow">

            <img
              class="cardLogo"
              src="${
                site.logoUrl ||
                'https://via.placeholder.com/200x200.png?text=NS'
              }"
            >

            <div>

              <div class="siteTitle">
                ${site.title}
              </div>

              <a
                class="siteLink"
                href="${site.url}"
                target="_blank"
              >
                ${site.url}
              </a>

            </div>

          </div>

          <div class="siteDesc">
            ${site.desc || ""}
          </div>

          <div class="badges">

            <div class="badge">
              ${site.category || "Genel"}
            </div>

            ${
              site.adActive
              ? `<div class="badge sponsor">Sponsorlu</div>`
              : `<div class="badge">Organik Sonuç</div>`
            }

            <div class="badge score">
              AI Skor: ${site.aiScore}
            </div>

            <div class="badge rating">
              ⭐ ${(Math.random()*1+4).toFixed(1)}
            </div>

            ${
              site.city
              ? `<div class="badge">📍 ${site.city}</div>`
              : ""
            }

          </div>

          <div class="cardButtons">

            <a
              class="btn btnGreen"
              href="${site.url}"
              target="_blank"
              onclick="registerClick('${site._id}')"
            >
              Siteye Git
            </a>

            <a
              class="btn btnBlue"
              href="/site.html?id=${site._id}"
            >
              Detay Sayfası
            </a>

            <button
              class="btn btnPurple"
              onclick="shareSite('${site.title}','/site.html?id=${site._id}')"
            >
              Paylaş
            </button>

          </div>

        </div>

      </div>

    `;
  });
}

async function registerClick(id){

  try{

    await fetch(`/api/sites/${id}/click`,{
      method:"POST"
    });

  }catch(err){
    console.log(err);
  }
}

function shareSite(title,url){

  if(navigator.share){

    navigator.share({
      title,
      url:location.origin + url
    });

  }else{

    navigator.clipboard.writeText(
      location.origin + url
    );

    alert("Link kopyalandı.");
  }
}

document
.getElementById("searchInput")
.addEventListener("keypress",e=>{

  if(e.key === "Enter"){
    searchSite();
  }
});

loadSites();

</script>

</body>
</html>
