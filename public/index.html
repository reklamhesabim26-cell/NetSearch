<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NetSearch - AI Destekli Arama Motoru</title>
<meta name="description" content="NetSearch ile işletmeleri, web sitelerini ve yapay zeka destekli arama sonuçlarını keşfedin.">
<meta name="robots" content="index, follow">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#fff;
  color:#111827;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

.top{
  display:flex;
  justify-content:flex-end;
  gap:12px;
  padding:18px 24px;
}

.top a{
  text-decoration:none;
  color:#0369a1;
  font-weight:bold;
  border:1px solid #bae6fd;
  padding:9px 15px;
  border-radius:999px;
  background:white;
}

.hero{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:40px 16px 80px;
}

.logo{
  font-size:76px;
  font-weight:900;
  letter-spacing:-3px;
  margin-bottom:28px;
}

.logo .net{color:#111827}
.logo .search{color:#0ea5e9}

.searchBox{
  width:min(720px,92vw);
  position:relative;
}

.searchRow{
  width:100%;
  display:flex;
  align-items:center;
  border:1px solid #d1d5db;
  border-radius:999px;
  padding:8px 10px 8px 20px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
  background:white;
}

.searchRow:hover{
  box-shadow:0 4px 18px rgba(0,0,0,.12);
}

.searchIcon{
  color:#64748b;
  margin-right:10px;
}

.searchRow input{
  flex:1;
  border:0;
  outline:0;
  font-size:18px;
  padding:13px 8px;
}

.searchRow button{
  border:0;
  background:#0ea5e9;
  color:white;
  font-weight:bold;
  padding:12px 22px;
  border-radius:999px;
  cursor:pointer;
}

.voice{
  background:#16a34a!important;
  padding:12px 15px!important;
  margin-left:6px;
}

.buttons{
  display:flex;
  justify-content:center;
  gap:12px;
  margin-top:24px;
  flex-wrap:wrap;
}

.buttons button{
  border:1px solid #e5e7eb;
  background:#f8fafc;
  padding:11px 17px;
  border-radius:8px;
  cursor:pointer;
  color:#111827;
  font-weight:bold;
}

.buttons button:hover{
  border-color:#bae6fd;
  background:#eff6ff;
}

.suggestions{
  display:none;
  position:absolute;
  left:0;
  right:0;
  top:62px;
  background:white;
  border:1px solid #e5e7eb;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 15px 35px rgba(0,0,0,.14);
  z-index:20;
}

.suggestions div{
  padding:13px 18px;
  cursor:pointer;
  border-bottom:1px solid #f1f5f9;
}

.suggestions div:hover{
  background:#f8fafc;
}

.resultsWrap{
  display:none;
  width:min(960px,94vw);
  margin:0 auto 70px;
}

.aiBox{
  background:#f8fbff;
  border:1px solid #bfdbfe;
  border-radius:18px;
  padding:18px;
  margin-bottom:18px;
}

.aiBox h2{
  margin:0 0 8px;
  color:#0284c7;
  font-size:20px;
}

.aiBox p{
  margin:0;
  line-height:1.6;
  color:#334155;
}

.sectionTitle{
  margin:24px 0 12px;
  font-size:22px;
}

.resultGrid{
  display:grid;
  gap:16px;
}

.card{
  border:1px solid #e5e7eb;
  border-radius:18px;
  padding:18px;
  background:white;
  box-shadow:0 8px 24px rgba(15,23,42,.06);
}

.card.sponsored{
  border-color:#38bdf8;
  box-shadow:0 12px 30px rgba(14,165,233,.14);
}

.cardTop{
  display:flex;
  align-items:center;
  gap:14px;
}

.siteLogo,.logoLetter{
  width:58px;
  height:58px;
  border-radius:16px;
  background:#e0f2fe;
  border:1px solid #bae6fd;
  object-fit:cover;
  flex-shrink:0;
}

.logoLetter{
  display:flex;
  align-items:center;
  justify-content:center;
  color:#0284c7;
  font-size:24px;
  font-weight:900;
}

.title{
  font-size:23px;
  color:#0284c7;
  font-weight:900;
  margin-bottom:4px;
}

.url{
  color:#16a34a;
  font-weight:bold;
  font-size:14px;
  word-break:break-all;
}

.desc{
  color:#334155;
  line-height:1.6;
  margin:14px 0;
}

.badges{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:14px;
}

.badge{
  background:#f8fafc;
  border:1px solid #e2e8f0;
  color:#0369a1;
  border-radius:999px;
  padding:7px 10px;
  font-size:12px;
  font-weight:bold;
}

.badge.ad{
  color:#92400e;
  background:#fef3c7;
  border-color:#f59e0b;
}

.badge.verified{
  color:#166534;
  background:#dcfce7;
  border-color:#86efac;
}

.actions{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
}

.actions a,.actions button{
  border:0;
  text-decoration:none;
  color:white;
  padding:10px 14px;
  border-radius:999px;
  font-weight:bold;
  cursor:pointer;
}

.visit{background:#16a34a}
.detail{background:#2563eb}
.call{background:#0f766e}
.whatsapp{background:#22c55e}
.share{background:#9333ea}

.empty,.loading{
  text-align:center;
  color:#64748b;
  padding:30px;
  font-weight:bold;
}

footer{
  background:#f8fafc;
  border-top:1px solid #e5e7eb;
  padding:14px 22px;
  display:flex;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:12px;
  color:#64748b;
  font-size:14px;
}

footer a{
  color:#475569;
  text-decoration:none;
  margin-right:14px;
}

@media(max-width:700px){
  .top{
    padding:14px;
  }

  .logo{
    font-size:54px;
  }

  .searchRow{
    padding-left:14px;
  }

  .searchRow input{
    font-size:16px;
  }

  .searchRow button{
    padding:11px 16px;
  }

  .buttons{
    gap:8px;
  }

  .buttons button{
    width:100%;
  }

  .actions a,.actions button{
    width:100%;
    text-align:center;
  }

  footer{
    padding-bottom:24px;
  }
}
</style>
</head>

<body>

<div class="top">
  <a href="/login.html">Giriş</a>
  <a href="/register.html">Kayıt Ol</a>
</div>

<section class="hero" id="hero">
  <div class="logo"><span class="net">Net</span><span class="search">Search</span></div>

  <div class="searchBox">
    <div class="searchRow">
      <span class="searchIcon">🔎</span>
      <input id="searchInput" type="text" placeholder="NetSearch'te ara..." autocomplete="off">
      <button onclick="searchSites()">Ara</button>
      <button class="voice" onclick="voiceSearch()">🎙️</button>
    </div>

    <div id="suggestions" class="suggestions"></div>
  </div>

  <div class="buttons">
    <button onclick="quickSearch('Eskişehir kombi servisi')">NetSearch'te Ara</button>
    <button onclick="quickSearch('Yakınımdaki işletmeler')">Kendimi Şanslı Hissediyorum</button>
  </div>
</section>

<main id="resultsWrap" class="resultsWrap">
  <div id="aiBox" class="aiBox">
    <h2>NetSearch AI Özeti</h2>
    <p id="aiText"></p>
  </div>

  <h2 id="sponsoredTitle" class="sectionTitle" style="display:none;">Sponsorlu Sonuçlar</h2>
  <div id="sponsoredResults" class="resultGrid"></div>

  <h2 id="organicTitle" class="sectionTitle" style="display:none;">Arama Sonuçları</h2>
  <div id="results" class="resultGrid"></div>
</main>

<footer>
  <div>
    <a href="#">Hakkında</a>
    <a href="#">Reklam</a>
    <a href="/login.html">İşletme</a>
    <a href="#">Arama nasıl çalışır?</a>
  </div>
  <div>© 2026 NetSearch</div>
</footer>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(reg => reg.unregister()));
}
if (window.caches) {
  caches.keys().then(names => names.forEach(name => caches.delete(name)));
}

const input = document.getElementById("searchInput");
const suggestionsBox = document.getElementById("suggestions");

input.addEventListener("keydown", function(e){
  if(e.key === "Enter") searchSites();
});

input.addEventListener("input", async function(){
  const q = input.value.trim();

  if(q.length < 2){
    suggestionsBox.style.display = "none";
    return;
  }

  try{
    const res = await fetch(`/api/autocomplete?q=${encodeURIComponent(q)}&t=${Date.now()}`, {cache:"no-store"});
    const data = await res.json();

    suggestionsBox.innerHTML = "";

    if(!Array.isArray(data) || data.length === 0){
      suggestionsBox.style.display = "none";
      return;
    }

    data.slice(0,8).forEach(item=>{
      const div = document.createElement("div");
      div.innerText = item;
      div.onclick = () => {
        input.value = item;
        suggestionsBox.style.display = "none";
        searchSites();
      };
      suggestionsBox.appendChild(div);
    });

    suggestionsBox.style.display = "block";
  }catch{
    suggestionsBox.style.display = "none";
  }
});

function quickSearch(text){
  input.value = text;
  searchSites();
}

function voiceSearch(){
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if(!SpeechRecognition){
    alert("Tarayıcın sesli aramayı desteklemiyor.");
    return;
  }

  const recognition = new SpeechRecognition();
  recognition.lang = "tr-TR";
  recognition.start();

  recognition.onresult = function(event){
    input.value = event.results[0][0].transcript;
    searchSites();
  };
}

async function searchSites(){
  const q = input.value.trim();

  document.getElementById("hero").style.justifyContent = "flex-start";
  document.getElementById("hero").style.paddingTop = "35px";
  document.getElementById("hero").style.paddingBottom = "30px";
  document.getElementById("resultsWrap").style.display = "block";

  document.getElementById("sponsoredTitle").style.display = "none";
  document.getElementById("organicTitle").style.display = "none";
  document.getElementById("sponsoredResults").innerHTML = "";
  document.getElementById("results").innerHTML = `<div class="loading">Aranıyor...</div>`;

  try{
    const res = await fetch(`/api/search?q=${encodeURIComponent(q)}&t=${Date.now()}`, {cache:"no-store"});
    const data = await res.json();

    const sponsored = data.sponsored || [];
    const organic = data.results || [];

    document.getElementById("results").innerHTML = "";

    document.getElementById("aiText").innerText =
      data.aiAnswer || `"${q || "Tüm sonuçlar"}" için en alakalı sonuçlar listelendi.`;

    if(sponsored.length){
      document.getElementById("sponsoredTitle").style.display = "block";
      sponsored.forEach(site=>{
        document.getElementById("sponsoredResults").appendChild(createCard(site,true));
      });
    }

    if(organic.length){
      document.getElementById("organicTitle").style.display = "block";
      organic.forEach(site=>{
        document.getElementById("results").appendChild(createCard(site,false));
      });
    }

    if(!sponsored.length && !organic.length){
      document.getElementById("results").innerHTML =
        `<div class="empty">Sonuç bulunamadı. Daha farklı kelimelerle tekrar ara.</div>`;
    }

    document.getElementById("resultsWrap").scrollIntoView({behavior:"smooth",block:"start"});

  }catch(err){
    document.getElementById("results").innerHTML =
      `<div class="empty" style="color:#dc2626;">Sunucu bağlantı hatası.</div>`;
  }
}

function createCard(site,isSponsored){
  const card = document.createElement("div");
  card.className = "card" + (isSponsored ? " sponsored" : "");

  const id = site._id || "";
  const title = site.title || site.name || site.businessName || "İsimsiz Site";
  const url = site.url || site.website || site.link || "#";
  const desc = site.description || site.desc || site.address || "Açıklama bulunamadı.";

  const logo = site.logo || site.logoUrl || site.image || "";
  const hasLogo = logo && String(logo).trim() !== "";

  const category = site.category || "Genel";
  const city = site.city || site.sehir || "";
  const district = site.district || site.ilce || "";
  const phone = site.phone || site.telefon || "";
  const whatsapp = site.whatsapp || phone;
  const verified = site.verified || site.isVerified;
  const score = site.searchScore || site.finalScore || site.aiScore || "";
  const firstLetter = title.trim().charAt(0).toUpperCase() || "N";

  card.innerHTML = `
    <div class="cardTop">
      ${
        hasLogo
        ? `<img class="siteLogo" src="${escapeHtml(logo)}" onerror="this.outerHTML='<div class=&quot;logoLetter&quot;>${escapeHtml(firstLetter)}</div>'">`
        : `<div class="logoLetter">${escapeHtml(firstLetter)}</div>`
      }

      <div>
        <div class="title">${escapeHtml(title)}</div>
        <div class="url">${escapeHtml(url)}</div>
      </div>
    </div>

    <p class="desc">${escapeHtml(desc)}</p>

    <div class="badges">
      ${isSponsored ? `<span class="badge ad">Sponsorlu</span>` : `<span class="badge">Organik Sonuç</span>`}
      ${verified ? `<span class="badge verified">✅ Doğrulanmış</span>` : ""}
      <span class="badge">${escapeHtml(category)}</span>
      ${city ? `<span class="badge">📍 ${escapeHtml(city)}${district ? " / " + escapeHtml(district) : ""}</span>` : ""}
      ${score ? `<span class="badge">AI Skor: ${Math.round(score)}</span>` : ""}
      ${phone ? `<span class="badge">📞 ${escapeHtml(phone)}</span>` : ""}
    </div>

    <div class="actions">
      <a class="visit" href="${escapeHtml(url)}" target="_blank" onclick="trackClick('${id}')">Siteye Git</a>
      <a class="detail" href="/site.html?id=${id}">Detay Sayfası</a>
      ${phone ? `<a class="call" href="tel:${cleanPhone(phone)}">Ara</a>` : ""}
      ${whatsapp ? `<a class="whatsapp" href="https://wa.me/${cleanPhone(whatsapp)}" target="_blank">WhatsApp</a>` : ""}
      <button class="share" onclick="shareSite('${escapeAttr(title)}','${escapeAttr(url)}')">Paylaş</button>
    </div>
  `;

  return card;
}

async function trackClick(id){
  if(!id) return;
  try{
    await fetch(`/api/sites/${id}/click?t=${Date.now()}`, {method:"POST",cache:"no-store"});
  }catch{}
}

function shareSite(title,url){
  if(navigator.share){
    navigator.share({title,url});
  }else{
    navigator.clipboard.writeText(url);
    alert("Link kopyalandı.");
  }
}

function cleanPhone(phone){
  let p = String(phone || "").replace(/\D/g,"");
  if(p.startsWith("0")) p = "90" + p.slice(1);
  if(!p.startsWith("90") && p.length === 10) p = "90" + p;
  return p;
}

function escapeHtml(text){
  return String(text || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function escapeAttr(text){
  return String(text || "")
    .replaceAll("\\","\\\\")
    .replaceAll("'","\\'")
    .replaceAll('"',"&quot;");
}
</script>

</body>
</html>
