<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NetSearch AI</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#020817;color:white;min-height:100vh}
.header{padding:24px 50px;display:flex;justify-content:space-between;align-items:center}
.brand{font-size:30px;font-weight:bold;color:#38bdf8}
.nav a{color:white;text-decoration:none;margin-left:12px;background:#0f172a;border:1px solid #1e293b;padding:11px 18px;border-radius:999px}
.container{max-width:1200px;margin:auto;padding:70px 20px;text-align:center}
.logo{font-size:78px;font-weight:bold;background:linear-gradient(90deg,#00bfff,#2563eb);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{color:#cbd5e1;font-size:22px;margin:14px 0 36px}
.searchArea{max-width:850px;margin:auto;position:relative}
.searchBox{display:flex;background:#0f172a;border:1px solid #1e293b;border-radius:60px;overflow:hidden;box-shadow:0 0 40px rgba(56,189,248,.12)}
.searchBox input{flex:1;padding:24px 28px;background:transparent;border:none;outline:none;color:white;font-size:20px}
.searchBox button{width:170px;border:none;background:linear-gradient(90deg,#00bfff,#2563eb);color:white;font-size:20px;cursor:pointer}
.suggestions{display:none;position:absolute;top:78px;left:0;right:0;background:#0f172a;border:1px solid #1e293b;border-radius:20px;overflow:hidden;text-align:left;z-index:20}
.suggestion{padding:16px 22px;border-bottom:1px solid #1e293b;cursor:pointer;color:#cbd5e1}
.suggestion:hover{background:#1e293b;color:white}
.quick{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:24px}
.quick button{background:#0f172a;color:white;border:1px solid #1e293b;padding:10px 16px;border-radius:999px;cursor:pointer}

.results{margin-top:55px;text-align:left}
.resultCard{background:#0f172a;border:1px solid #1e293b;border-radius:24px;padding:0;margin-bottom:24px;overflow:hidden;transition:.2s}
.resultCard:hover{transform:translateY(-2px);border-color:#38bdf8}
.resultCard.sponsored{border-color:#9333ea;box-shadow:0 0 30px rgba(147,51,234,.18)}
.cover{width:100%;height:180px;object-fit:cover;background:#111827}
.cardBody{padding:24px}
.cardTop{display:flex;gap:16px;align-items:flex-start}
.siteLogo{width:72px;height:72px;border-radius:18px;object-fit:cover;background:#020817;border:1px solid #334155}
.title{color:#38bdf8;font-size:26px;font-weight:bold;text-decoration:none}
.url{display:block;color:#22c55e;margin:8px 0;word-break:break-all}
.desc{color:#cbd5e1;font-size:16px;line-height:1.6;margin-top:10px}
.badge{display:inline-block;margin-top:12px;margin-right:6px;padding:6px 12px;border-radius:999px;font-size:13px;background:#1e293b;color:#38bdf8}
.sponsorBadge{background:#9333ea;color:white}
.aiBadge{background:#0f766e;color:white}
.catBadge{background:#1d4ed8;color:white}
.ratingBadge{background:#ca8a04;color:white}
.actions{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap}
.actionBtn{border:none;border-radius:999px;padding:10px 15px;cursor:pointer;color:white;background:#2563eb;text-decoration:none;font-size:14px}
.actionBtn.green{background:#16a34a}
.actionBtn.orange{background:#ea580c}
.actionBtn.purple{background:#9333ea}

.reviewBox{margin-top:18px;background:#111827;border:1px solid #1e293b;border-radius:18px;padding:16px;display:none}
.reviewItem{border-top:1px solid #1e293b;padding-top:12px;margin-top:12px;color:#cbd5e1}
.reviewForm{display:grid;grid-template-columns:1fr 110px;gap:10px;margin-top:14px}
.reviewForm input,.reviewForm select,.reviewForm textarea{width:100%;padding:12px;background:#020817;border:1px solid #334155;border-radius:10px;color:white}
.reviewForm textarea{grid-column:1 / -1;min-height:80px}
.reviewForm button{grid-column:1 / -1;padding:12px;border:none;border-radius:10px;background:#16a34a;color:white;cursor:pointer}
.empty{text-align:center;color:#94a3b8;font-size:22px;margin-top:50px}

@media(max-width:700px){
.header{padding:18px;flex-direction:column;gap:14px}
.logo{font-size:52px}
.searchBox{flex-direction:column;border-radius:25px}
.searchBox button{width:100%;padding:18px}
.suggestions{top:132px}
.nav a{display:inline-block;margin:4px}
.cardTop{flex-direction:column}
.reviewForm{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="header">
  <div class="brand">NetSearch AI</div>
  <div class="nav" id="navMenu"></div>
</div>

<div class="container">

  <div class="logo">NetSearch</div>
  <div class="subtitle">AI skor, işletme kartları, yorumlar ve sponsorlu arama motoru</div>

  <div class="searchArea">
    <div class="searchBox">
      <input id="searchInput" type="text" placeholder="Eskişehir kombi servisi, çiçekçi, e-devlet..." oninput="showSuggestions()">
      <button ontouchstart="hideKeyboard()" onmousedown="hideKeyboard()" onclick="searchSite()">Ara</button>
    </div>
    <div class="suggestions" id="suggestions"></div>
  </div>

  <div class="quick">
    <button onclick="quickSearch('kombi servisi')">Kombi Servisi</button>
    <button onclick="quickSearch('çiçekçi')">Çiçekçi</button>
    <button onclick="quickSearch('bakkal')">Bakkal</button>
    <button onclick="quickSearch('e devlet')">E-Devlet</button>
    <button onclick="quickSearch('teknik servis')">Teknik Servis</button>
  </div>

  <div class="results" id="results"></div>

</div>

<script>
let sites = [];
let reviewsCache = {};

const navMenu = document.getElementById("navMenu");
const user = JSON.parse(localStorage.getItem("user"));

if(!user){
  navMenu.innerHTML = `
    <a href="/login.html">Giriş Yap</a>
    <a href="/register.html">Kayıt Ol</a>
  `;
}else if(user.role === "admin"){
  navMenu.innerHTML = `
    <a href="/admin.html">Admin Panel</a>
    <a href="/settings.html">Ayarlar</a>
    <a href="#" onclick="logout()">Çıkış</a>
  `;
}else{
  navMenu.innerHTML = `
    <a href="/user-panel.html">Panelim</a>
    <a href="/settings.html">Ayarlar</a>
    <a href="#" onclick="logout()">Çıkış</a>
  `;
}

function logout(){
  localStorage.removeItem("user");
  window.location.href = "/";
}

function hideKeyboard(){
  const input = document.getElementById("searchInput");
  input.blur();
  setTimeout(() => {
    if(document.activeElement) document.activeElement.blur();
  }, 50);
}

function normalize(text){
  return (text || "")
    .toLowerCase()
    .replaceAll("ı","i")
    .replaceAll("ğ","g")
    .replaceAll("ü","u")
    .replaceAll("ş","s")
    .replaceAll("ö","o")
    .replaceAll("ç","c");
}

async function loadSites(){
  const res = await fetch("/api/sites");
  const data = await res.json();
  sites = data.filter(site => site.status === "approved");
}

loadSites();

function isSponsored(site){
  return site.adActive &&
  Number(site.balance || 0) > 0 &&
  Number(site.todaySpent || 0) < Number(site.dailyLimit || 0);
}

function logoFallback(site){
  return site.logoUrl || "https://via.placeholder.com/150x150.png?text=NS";
}

function coverFallback(site){
  return site.imageUrl || "";
}

function getLocationText(site){
  return `${site.city || ""} ${site.district || ""}`.trim();
}

function buildSuggestions(){
  const set = new Set();

  sites.forEach(site => {
    if(site.title) set.add(site.title.toLowerCase());
    if(site.category) set.add(site.category.toLowerCase());

    if(site.keywords){
      site.keywords.split(" ").forEach(w => {
        if(w.length > 2) set.add(w.toLowerCase());
      });

      site.keywords.split(",").forEach(w => {
        if(w.trim().length > 2) set.add(w.trim().toLowerCase());
      });
    }

    if(site.city && site.title) set.add(`${site.city} ${site.title}`.toLowerCase());
    if(site.city && site.category) set.add(`${site.city} ${site.category}`.toLowerCase());
  });

  [
    "eskişehir kombi servisi",
    "çiçekçi",
    "bakkal",
    "e devlet",
    "beyaz eşya servisi",
    "çamaşır makinesi servisi",
    "buzdolabı tamiri",
    "klima servisi",
    "teknik servis",
    "yorumları iyi firma"
  ].forEach(x => set.add(x));

  return Array.from(set);
}

function showSuggestions(){
  const input = document.getElementById("searchInput").value.trim();
  const box = document.getElementById("suggestions");

  box.innerHTML = "";

  if(input.length < 2){
    box.style.display = "none";
    return;
  }

  const list = buildSuggestions()
    .filter(item => normalize(item).includes(normalize(input)))
    .slice(0,8);

  if(list.length === 0){
    box.style.display = "none";
    return;
  }

  list.forEach(item => {
    box.innerHTML += `
      <div class="suggestion" onclick="selectSuggestion('${item.replace(/'/g,"\\'")}')">
        🔎 ${item}
      </div>
    `;
  });

  box.style.display = "block";
}

function selectSuggestion(text){
  document.getElementById("searchInput").value = text;
  document.getElementById("suggestions").style.display = "none";
  searchSite();
}

function quickSearch(text){
  document.getElementById("searchInput").value = text;
  searchSite();
}

function calculateAIScore(site, input){
  let score = 0;

  const query = normalize(input);
  const words = query.split(" ").filter(word => word.length > 1);

  const title = normalize(site.title || "");
  const desc = normalize(site.desc || "");
  const keywords = normalize(site.keywords || "");
  const category = normalize(site.category || "");
  const city = normalize(site.city || "");
  const district = normalize(site.district || "");
  const address = normalize(site.address || "");
  const negativeKeywords = normalize(site.negativeKeywords || "");

  const fullText = `${title} ${desc} ${keywords} ${category} ${city} ${district} ${address}`;

  words.forEach(word => {
    if(title.includes(word)) score += 10;
    if(keywords.includes(word)) score += 8;
    if(category.includes(word)) score += 7;
    if(desc.includes(word)) score += 4;
    if(city.includes(word)) score += 4;
    if(district.includes(word)) score += 4;
    if(address.includes(word)) score += 3;
    if(fullText.includes(word)) score += 2;
    if(negativeKeywords.includes(word)) score -= 30;
  });

  if(title === query) score += 30;
  if(keywords === query) score += 25;
  if(category === query) score += 20;
  if(title.includes(query)) score += 15;
  if(keywords.includes(query)) score += 12;

  if(isSponsored(site)) score += 15;

  return score;
}

async function getReviews(siteId){
  if(reviewsCache[siteId]) return reviewsCache[siteId];

  const res = await fetch(`/api/sites/${siteId}/reviews`);
  const reviews = await res.json();

  reviewsCache[siteId] = reviews;
  return reviews;
}

function averageRating(reviews){
  if(!reviews || reviews.length === 0) return "Yeni";
  const avg = reviews.reduce((sum,r) => sum + Number(r.rating || 5), 0) / reviews.length;
  return avg.toFixed(1);
}

function stars(rating){
  const n = Math.round(Number(rating || 5));
  return "★".repeat(n) + "☆".repeat(5 - n);
}

async function searchSite(){
  hideKeyboard();

  await loadSites();

  const input = document.getElementById("searchInput").value.trim();
  const results = document.getElementById("results");

  document.getElementById("suggestions").style.display = "none";
  results.innerHTML = "";

  if(!input){
    results.innerHTML = `<div class="empty">Lütfen arama yapın.</div>`;
    return;
  }

  let filtered = sites
    .map(site => ({
      ...site,
      aiScore: calculateAIScore(site, input)
    }))
    .filter(site => site.aiScore > 0)
    .sort((a,b) => b.aiScore - a.aiScore);

  if(filtered.length === 0){
    results.innerHTML = `<div class="empty">Sonuç bulunamadı.</div>`;
    return;
  }

  for(const site of filtered){
    const sponsor = isSponsored(site);
    const locationText = getLocationText(site);
    const reviews = await getReviews(site.id);
    const avg = averageRating(reviews);
    const cover = coverFallback(site);

    fetch(`/api/sites/${site.id}/view`, { method:"POST" });

    results.innerHTML += `
      <div class="resultCard ${sponsor ? "sponsored" : ""}">
        ${cover ? `<img class="cover" src="${cover}" onerror="this.style.display='none'">` : ""}

        <div class="cardBody">
          <div class="cardTop">
            <img class="siteLogo" src="${logoFallback(site)}" onerror="this.src='https://via.placeholder.com/150x150.png?text=NS'">

            <div>
              <a class="title" href="#" onclick="openResult('${site.id}', '${site.url.replace(/'/g,"\\'")}')">
                ${site.title}
              </a>

              <span class="url">${site.url}</span>

              <div>
                ${sponsor ? `<span class="badge sponsorBadge">Sponsorlu</span>` : `<span class="badge">Organik Sonuç</span>`}
                <span class="badge aiBadge">AI Skor: ${site.aiScore}</span>
                <span class="badge catBadge">${site.category || "Genel"}</span>
                <span class="badge ratingBadge">⭐ ${avg} (${reviews.length} yorum)</span>
              </div>

              ${locationText ? `<span class="badge">📍 ${locationText}</span>` : ""}
              ${site.phone ? `<span class="badge">📞 ${site.phone}</span>` : ""}
            </div>
          </div>

          <div class="desc">${site.desc || ""}</div>

          ${site.address ? `<div class="desc"><b>Adres:</b> ${site.address}</div>` : ""}

          <div class="actions">
            <button class="actionBtn green" onclick="openResult('${site.id}', '${site.url.replace(/'/g,"\\'")}')">
              Siteye Git
            </button>

            <button class="actionBtn" onclick="googleSearch('${site.title.replace(/'/g,"\\'")}')">
              Google’da Ara
            </button>

            <button class="actionBtn orange" onclick="toggleReviews('${site.id}')">
              Yorumları Gör / Yaz
            </button>
          </div>

          <div class="reviewBox" id="reviews-${site.id}">
            <h3>Yorumlar</h3>

            <div id="reviewList-${site.id}">
              ${reviews.length === 0 ? `<p class="desc">Henüz yorum yok. İlk yorumu sen yaz.</p>` : ""}
              ${reviews.map(r => `
                <div class="reviewItem">
                  <b>${r.userName || "Ziyaretçi"}</b> - <span style="color:#facc15">${stars(r.rating)}</span>
                  <p>${r.comment}</p>
                </div>
              `).join("")}
            </div>

            <div class="reviewForm">
              <input id="reviewName-${site.id}" placeholder="Adınız">
              <select id="reviewRating-${site.id}">
                <option value="5">5 Yıldız</option>
                <option value="4">4 Yıldız</option>
                <option value="3">3 Yıldız</option>
                <option value="2">2 Yıldız</option>
                <option value="1">1 Yıldız</option>
              </select>
              <textarea id="reviewComment-${site.id}" placeholder="Yorumunuzu yazın"></textarea>
              <button onclick="addReview('${site.id}')">Yorumu Gönder</button>
            </div>
          </div>
        </div>
      </div>
    `;
  }
}

function googleSearch(title){
  const q = encodeURIComponent(title + " yorumları güvenilir mi");
  window.open(`https://www.google.com/search?q=${q}`, "_blank");
}

function toggleReviews(siteId){
  const box = document.getElementById(`reviews-${siteId}`);
  box.style.display = box.style.display === "block" ? "none" : "block";
}

async function addReview(siteId){
  const userName = document.getElementById(`reviewName-${siteId}`).value.trim();
  const rating = document.getElementById(`reviewRating-${siteId}`).value;
  const comment = document.getElementById(`reviewComment-${siteId}`).value.trim();

  if(!comment){
    alert("Yorum yazmalısın.");
    return;
  }

  const res = await fetch(`/api/sites/${siteId}/reviews`, {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({
      userName:userName || "Ziyaretçi",
      rating,
      comment
    })
  });

  const data = await res.json();
  alert(data.message || "Yorum eklendi.");

  delete reviewsCache[siteId];
  searchSite();
}

async function openResult(id, url){
  hideKeyboard();

  await fetch(`/api/sites/${id}/click`, { method:"POST" });
  window.open(url, "_blank");
}

document.getElementById("searchInput").addEventListener("keydown", function(e){
  if(e.key === "Enter"){
    hideKeyboard();
    searchSite();
  }
});

document.addEventListener("click", function(e){
  if(!e.target.closest(".searchArea")){
    document.getElementById("suggestions").style.display = "none";
  }
});
</script>

</body>
</html>
