<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NetSearch Admin Panel</title>
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="manifest" href="/manifest.json">

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f9ff;color:#0f172a}
header{background:white;border-bottom:1px solid #dbeafe;padding:16px 22px}
.top{max-width:1250px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.logo{font-size:28px;font-weight:900}.logo span{color:#0ea5e9}
.wrap{max-width:1250px;margin:auto;padding:22px}
.panel{background:white;border:1px solid #dbeafe;border-radius:22px;padding:20px;margin-bottom:18px;box-shadow:0 12px 35px rgba(15,23,42,.06)}
h2{margin:0 0 14px;color:#0284c7}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.stat{background:#f8fbff;border:1px solid #dbeafe;border-radius:16px;padding:15px}
.stat b{display:block;font-size:28px;color:#0284c7}
input,textarea,select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:12px;margin-bottom:9px;font-size:14px}
textarea{min-height:78px}
label{font-weight:bold;font-size:13px;color:#334155}
button,a{border:0;border-radius:12px;padding:10px 14px;font-weight:bold;cursor:pointer;text-decoration:none;margin:3px}
.blue{background:#2563eb;color:white}.green{background:#16a34a;color:white}.red{background:#dc2626;color:white}.dark{background:#0f172a;color:white}.orange{background:#f59e0b;color:white}.gray{background:#64748b;color:white}
.card{border:1px solid #dbeafe;background:#f8fbff;border-radius:18px;padding:16px;margin:12px 0}
.badge{display:inline-block;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:bold;margin:4px;background:white;border:1px solid #bae6fd;color:#0369a1}
.pending{background:#fef3c7;border-color:#f59e0b;color:#92400e}
.active{background:#dcfce7;border-color:#86efac;color:#166534}
.rejected{background:#fee2e2;border-color:#fca5a5;color:#991b1b}
.small{font-size:13px;color:#64748b;word-break:break-all}
.preview{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 14px}
.preview img{width:88px;height:88px;object-fit:cover;border-radius:14px;border:1px solid #dbeafe;background:white}
.editBox{display:none;margin-top:14px;background:white;border:1px solid #dbeafe;border-radius:16px;padding:14px}
.msg{text-align:center;font-weight:bold;margin:10px}.ok{color:#16a34a}.err{color:#dc2626}
@media(max-width:700px){.top{flex-direction:column;align-items:flex-start}button,a{width:100%;text-align:center}}
</style>
</head>

<body>

<header>
  <div class="top">
    <div class="logo">Net<span>Search Admin</span></div>
    <div>
      <a class="blue" href="/index.html">Ana Sayfa</a>
      <button class="dark" onclick="logout()">Çıkış Yap</button>
    </div>
  </div>
</header>

<div class="wrap">

  <div class="panel">
    <h2>Genel Durum</h2>
    <div class="grid">
      <div class="stat"><b id="totalSites">0</b>Toplam İşletme</div>
      <div class="stat"><b id="pendingSites">0</b>Onay Bekleyen</div>
      <div class="stat"><b id="activeAds">0</b>Aktif Reklam</div>
      <div class="stat"><b id="totalUsers">0</b>Kullanıcı</div>
      <div class="stat"><b id="totalViews">0</b>Görüntüleme</div>
      <div class="stat"><b id="totalClicks">0</b>Tıklama</div>
      <div class="stat"><b id="totalSpent">0₺</b>Toplam Harcama</div>
    </div>
  </div>

  <div class="panel">
    <h2 id="formTitle">Admin Site / Reklam Ekle</h2>

    <input type="hidden" id="editingId">
    <input type="hidden" id="logoUrl">
    <input type="hidden" id="coverUrl">
    <input type="hidden" id="galleryUrls">

    <div class="grid">
      <div><label>İşletme Adı</label><input id="businessName" placeholder="Eskişehir Kombi Servisi"></div>
      <div><label>Web Site</label><input id="website" placeholder="https://siteadresi.com"></div>
      <div><label>Telefon / WhatsApp</label><input id="phone" placeholder="0530..."></div>
      <div><label>Owner E-posta</label><input id="ownerEmail" placeholder="kullanici@mail.com"></div>
    </div>

    <div class="grid">
      <div>
        <label>Logo Yükle</label>
        <input type="file" id="logoFile" accept="image/*" onchange="uploadSingle('logoFile','logoUrl','logoPreview')">
        <div id="logoPreview" class="preview"></div>
      </div>
      <div>
        <label>Kapak Görseli Yükle</label>
        <input type="file" id="coverFile" accept="image/*" onchange="uploadSingle('coverFile','coverUrl','coverPreview')">
        <div id="coverPreview" class="preview"></div>
      </div>
      <div>
        <label>Galeri Görselleri Yükle</label>
        <input type="file" id="galleryFile" accept="image/*" multiple onchange="uploadGallery()">
        <div id="galleryPreview" class="preview"></div>
      </div>
    </div>

    <div class="grid">
      <div><label>Başlık 1</label><input id="h1" placeholder="Eskişehir Kombi Servisi"></div>
      <div><label>Başlık 2</label><input id="h2" placeholder="Aynı Gün Servis"></div>
      <div><label>Başlık 3</label><input id="h3" placeholder="Hemen Ara"></div>
    </div>

    <label>Açıklama 1</label>
    <textarea id="d1" placeholder="İşletme ve reklam açıklaması"></textarea>

    <label>Açıklama 2</label>
    <textarea id="d2" placeholder="Ek açıklama"></textarea>

    <div class="grid">
      <div><label>Hedef Şehir</label><input id="city" placeholder="Eskişehir"></div>
      <div><label>Hedef İlçeler</label><input id="districts" placeholder="Tepebaşı, Odunpazarı"></div>
      <div><label>Kategori</label><input id="category" placeholder="Teknik Servis"></div>
    </div>

    <div class="grid">
      <div><label>Harita Enlem</label><input id="latitude" placeholder="39.7767"></div>
      <div><label>Harita Boylam</label><input id="longitude" placeholder="30.5206"></div>
    </div>

    <label>Anahtar Kelimeler</label>
    <textarea id="keywords" placeholder="kombi servisi, kombi tamircisi, beyaz eşya servisi"></textarea>

    <label>Negatif Anahtar Kelimeler</label>
    <textarea id="negativeKeywords" placeholder="ücretsiz, iş ilanı"></textarea>

    <div class="grid">
      <div><label>Günlük Bütçe ₺</label><input id="dailyLimit" type="number" placeholder="100"></div>
      <div><label>CPC / Tıklama Teklifi ₺</label><input id="cpc" type="number" placeholder="10"></div>
      <div><label>Bakiye ₺</label><input id="budget" type="number" placeholder="500"></div>
      <div>
        <label>Durum</label>
        <select id="statusSelect">
          <option value="pending">Onay Bekliyor</option>
          <option value="active">Aktif</option>
          <option value="rejected">Reddedildi</option>
        </select>
      </div>
      <div>
        <label>Reklam Yayında mı?</label>
        <select id="sponsorSelect">
          <option value="false">Hayır</option>
          <option value="true">Evet</option>
        </select>
      </div>
      <div>
        <label>Doğrulanmış mı?</label>
        <select id="verifiedSelect">
          <option value="false">Hayır</option>
          <option value="true">Evet</option>
        </select>
      </div>
    </div>

    <button class="green" onclick="saveAdminSite()">Kaydet / Güncelle</button>
    <button class="gray" onclick="clearForm()">Formu Temizle</button>
    <div id="createMsg" class="msg"></div>
  </div>

  <div class="panel">
    <h2>Reklam / İşletme Yönetimi</h2>

    <div class="grid">
      <input id="searchBox" placeholder="İşletme, e-posta, şehir ara..." oninput="renderSites()">
      <select id="filterStatus" onchange="renderSites()">
        <option value="all">Tümü</option>
        <option value="pending">Onay Bekleyenler</option>
        <option value="active">Aktif Reklamlar</option>
        <option value="rejected">Reddedilenler</option>
        <option value="passive">Pasifler</option>
      </select>
    </div>

    <div id="siteList">Yükleniyor...</div>
  </div>

</div>

<script>
let allSites=[];

window.onload=()=>{
  const userRaw=localStorage.getItem("user");
  const token=localStorage.getItem("token");

  if(!token || !userRaw){
    location.href="/login.html";
    return;
  }

  const user=JSON.parse(userRaw);
  if(user.role!=="admin"){
    alert("Admin yetkisi gerekli.");
    location.href="/login.html";
    return;
  }

  loadData();
};

function logout(){
  localStorage.removeItem("token");
  localStorage.removeItem("user");
  location.href="/login.html";
}

async function uploadSingle(fileId, hiddenId, previewId){
  const file=document.getElementById(fileId).files[0];
  if(!file) return;

  const fd=new FormData();
  fd.append("file",file);

  const res=await fetch("/api/upload",{method:"POST",body:fd});
  const data=await res.json();

  if(data.success){
    document.getElementById(hiddenId).value=data.url;
    document.getElementById(previewId).innerHTML=`<img src="${data.url}">`;
  }else{
    alert("Görsel yüklenemedi.");
  }
}

async function uploadGallery(){
  const files=document.getElementById("galleryFile").files;
  if(!files.length) return;

  const fd=new FormData();
  [...files].forEach(f=>fd.append("files",f));

  const res=await fetch("/api/upload/multiple",{method:"POST",body:fd});
  const data=await res.json();

  if(data.success){
    document.getElementById("galleryUrls").value=data.urls.join(",");
    document.getElementById("galleryPreview").innerHTML=data.urls.map(u=>`<img src="${u}">`).join("");
  }else{
    alert("Galeri yüklenemedi.");
  }
}

async function loadData(){
  try{
    const statsRes=await fetch("/api/admin/stats?t="+Date.now(),{cache:"no-store"});
    const stats=await statsRes.json();

    totalSites.innerText=stats.totalSites||0;
    pendingSites.innerText=stats.pendingSites||0;
    activeAds.innerText=stats.activeAds||0;
    totalUsers.innerText=stats.totalUsers||0;
    totalViews.innerText=stats.totalViews||0;
    totalClicks.innerText=stats.totalClicks||0;
    totalSpent.innerText=(stats.totalSpent||0)+"₺";

    const sitesRes=await fetch("/api/admin/sites?t="+Date.now(),{cache:"no-store"});
    allSites=await sitesRes.json();

    renderSites();
  }catch{
    siteList.innerHTML="Sunucuya bağlanılamadı.";
  }
}

function renderSites(){
  const q=document.getElementById("searchBox").value.toLowerCase();
  const filter=document.getElementById("filterStatus").value;
  const box=document.getElementById("siteList");
  box.innerHTML="";

  let list=allSites.filter(s=>{
    const text=JSON.stringify(s).toLowerCase();
    const active=s.sponsored||s.isSponsored||s.sponsorActive;

    if(q && !text.includes(q)) return false;
    if(filter==="pending" && s.status!=="pending") return false;
    if(filter==="active" && !active) return false;
    if(filter==="rejected" && s.status!=="rejected") return false;
    if(filter==="passive" && active) return false;

    return true;
  });

  if(!list.length){
    box.innerHTML="<p>Sonuç bulunamadı.</p>";
    return;
  }

  list.forEach(s=>{
    const active=s.sponsored||s.isSponsored||s.sponsorActive;
    const pending=s.status==="pending";
    const rejected=s.status==="rejected";

    const div=document.createElement("div");
    div.className="card";

    div.innerHTML=`
      <h3>${esc(s.title||s.businessName||"İsimsiz İşletme")}</h3>

      <div>
        ${pending?'<span class="badge pending">Onay Bekliyor</span>':""}
        ${active?'<span class="badge active">Aktif Reklam</span>':""}
        ${rejected?'<span class="badge rejected">Reddedildi</span>':""}
        <span class="badge">Owner: ${esc(s.ownerEmail||"Yok")}</span>
        <span class="badge">Şehir: ${esc(s.city||s.sehir||"")}</span>
        <span class="badge">Bütçe: ${s.sponsorBudget||0}₺</span>
        <span class="badge">Günlük: ${s.dailySpent||0}/${s.dailyLimit||0}₺</span>
        <span class="badge">CPC: ${s.cpc||s.sponsorCpc||0}₺</span>
        <span class="badge">Görüntüleme: ${s.views||0}</span>
        <span class="badge">Tıklama: ${s.clicks||0}</span>
        <span class="badge">Kalite: ${s.qualityScore||0}</span>
        <span class="badge">AdScore: ${s.adScore||0}</span>
      </div>

      <div class="preview">
        ${s.logo ? `<img src="${s.logo}">` : ""}
        ${s.cover ? `<img src="${s.cover}">` : ""}
        ${Array.isArray(s.gallery) ? s.gallery.slice(0,4).map(u=>`<img src="${u}">`).join("") : ""}
      </div>

      <p><b>Başlıklar:</b> ${esc([s.adHeadline1,s.adHeadline2,s.adHeadline3].filter(Boolean).join(" | "))}</p>
      <p><b>Açıklamalar:</b> ${esc([s.adDescription1,s.adDescription2].filter(Boolean).join(" "))}</p>
      <p><b>Anahtar:</b> ${esc(arrayText(s.keywords||s.tags))}</p>
      <p><b>Negatif:</b> ${esc(arrayText(s.negativeKeywords))}</p>
      ${s.rejectReason ? `<p style="color:#dc2626"><b>Red nedeni:</b> ${esc(s.rejectReason)}</p>` : ""}
      ${s.adStoppedReason ? `<p style="color:#92400e"><b>Durdurma nedeni:</b> ${esc(s.adStoppedReason)}</p>` : ""}
      <p class="small">${esc(s.url||s.website||"")}</p>

      <button class="green" onclick="approveAd('${s._id}')">Onayla ve Yayına Al</button>
      <button class="orange" onclick="pauseAd('${s._id}')">Reklamı Durdur</button>
      <button class="red" onclick="rejectAd('${s._id}')">Reddet</button>
      <button class="dark" onclick="deleteAd('${s._id}')">Sil</button>
      <button class="blue" onclick="editAdminSite('${s._id}')">Forma Al / Düzenle</button>
    `;

    box.appendChild(div);
  });
}

function editAdminSite(id){
  const s=allSites.find(x=>x._id===id);
  if(!s) return;

  formTitle.innerText="Admin Site / Reklam Düzenle";
  set("editingId",s._id);
  set("businessName",s.title||s.businessName||"");
  set("website",s.url||s.website||"");
  set("phone",s.phone||s.telefon||"");
  set("ownerEmail",s.ownerEmail||"");
  set("logoUrl",s.logo||s.logoUrl||"");
  set("coverUrl",s.cover||s.coverUrl||"");
  set("galleryUrls",arrayText(s.gallery));
  set("h1",s.adHeadline1||s.title||"");
  set("h2",s.adHeadline2||"");
  set("h3",s.adHeadline3||"");
  set("d1",s.adDescription1||s.description||"");
  set("d2",s.adDescription2||"");
  set("city",s.city||s.sehir||arrayText(s.targetCities));
  set("districts",arrayText(s.targetDistricts)||s.district||s.ilce||"");
  set("category",s.category||"");
  set("latitude",s.latitude||"");
  set("longitude",s.longitude||"");
  set("keywords",arrayText(s.keywords||s.tags));
  set("negativeKeywords",arrayText(s.negativeKeywords));
  set("dailyLimit",s.dailyLimit||0);
  set("cpc",s.cpc||s.sponsorCpc||0);
  set("budget",s.sponsorBudget||0);
  set("statusSelect",s.status||"pending");
  set("sponsorSelect",(s.sponsored||s.isSponsored||s.sponsorActive) ? "true" : "false");
  set("verifiedSelect",(s.verified||s.isVerified) ? "true" : "false");

  logoPreview.innerHTML=s.logo ? `<img src="${s.logo}">` : "";
  coverPreview.innerHTML=s.cover ? `<img src="${s.cover}">` : "";
  galleryPreview.innerHTML=Array.isArray(s.gallery) ? s.gallery.map(u=>`<img src="${u}">`).join("") : "";

  window.scrollTo({top:0,behavior:"smooth"});
}

async function saveAdminSite(){
  const msg=document.getElementById("createMsg");
  msg.className="msg";
  msg.innerText="";

  const id=val("editingId");
  const name=val("businessName");
  const url=val("website");
  const phone=val("phone");
  const sponsor=val("sponsorSelect")==="true";
  const verified=val("verifiedSelect")==="true";
  const status=val("statusSelect");

  if(!name || !url){
    msg.className="msg err";
    msg.innerText="İşletme adı ve web site zorunlu.";
    return;
  }

  const payload={
    title:name,name,businessName:name,
    url,website:url,link:url,
    phone,telefon:phone,whatsapp:phone,
    ownerEmail:val("ownerEmail"),

    logo:val("logoUrl"),
    logoUrl:val("logoUrl"),
    image:val("logoUrl"),
    cover:val("coverUrl"),
    coverUrl:val("coverUrl"),
    gallery:toArray(val("galleryUrls")),

    adHeadline1:val("h1")||name,
    adHeadline2:val("h2"),
    adHeadline3:val("h3"),
    adDescription1:val("d1"),
    adDescription2:val("d2"),
    description:val("d1"),
    desc:val("d1"),

    city:val("city"),
    sehir:val("city"),
    targetCities:toArray(val("city")),
    targetDistricts:toArray(val("districts")),
    category:val("category")||"Genel",

    latitude:Number(val("latitude")||0),
    longitude:Number(val("longitude")||0),

    keywords:val("keywords"),
    tags:val("keywords"),
    negativeKeywords:val("negativeKeywords"),

    dailyLimit:Number(val("dailyLimit")||0),
    cpc:Number(val("cpc")||0),
    sponsorCpc:Number(val("cpc")||0),
    sponsorBudget:Number(val("budget")||0),

    status,
    approved:status==="active",
    sponsored:sponsor,
    isSponsored:sponsor,
    sponsorActive:sponsor,
    verified,
    isVerified:verified,
    rejectReason:"",
    adStoppedReason:""
  };

  try{
    const endpoint=id ? "/api/admin/sites/"+id : "/api/admin/sites";
    const method=id ? "PATCH" : "POST";

    const res=await fetch(endpoint,{
      method,
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(payload)
    });

    const data=await res.json();

    if(data.success){
      msg.className="msg ok";
      msg.innerText=id ? "Kayıt güncellendi." : "Yeni kayıt eklendi.";
      clearForm();
      loadData();
    }else{
      msg.className="msg err";
      msg.innerText="İşlem başarısız.";
    }
  }catch{
    msg.className="msg err";
    msg.innerText="Sunucuya bağlanılamadı.";
  }
}

async function approveAd(id){
  await updateSite(id,{
    status:"active",
    approved:true,
    sponsored:true,
    isSponsored:true,
    sponsorActive:true,
    verified:true,
    isVerified:true,
    rejectReason:"",
    adStoppedReason:""
  });
}

async function pauseAd(id){
  await updateSite(id,{
    sponsored:false,
    isSponsored:false,
    sponsorActive:false,
    adStoppedReason:"Admin durdurdu"
  });
}

async function rejectAd(id){
  const reason=prompt("Red nedeni:", "Eksik veya hatalı bilgi");
  await updateSite(id,{
    status:"rejected",
    approved:false,
    sponsored:false,
    isSponsored:false,
    sponsorActive:false,
    rejectReason:reason||"Reddedildi"
  });
}

async function deleteAd(id){
  if(!confirm("Silinsin mi?")) return;
  await fetch("/api/admin/sites/"+id,{method:"DELETE"});
  loadData();
}

async function updateSite(id,payload){
  try{
    const res=await fetch("/api/admin/sites/"+id,{
      method:"PATCH",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(payload)
    });

    const data=await res.json();

    if(data.success){
      loadData();
    }else{
      alert("İşlem başarısız.");
    }
  }catch{
    alert("Sunucuya bağlanılamadı.");
  }
}

function clearForm(){
  formTitle.innerText="Admin Site / Reklam Ekle";
  document.querySelectorAll("input,textarea").forEach(x=>{
    if(x.type!=="file") x.value="";
  });
  statusSelect.value="pending";
  sponsorSelect.value="false";
  verifiedSelect.value="false";
  logoPreview.innerHTML="";
  coverPreview.innerHTML="";
  galleryPreview.innerHTML="";
}

function val(id){return document.getElementById(id).value.trim();}
function set(id,v){document.getElementById(id).value=v||"";}
function toArray(v){return String(v||"").split(",").map(x=>x.trim()).filter(Boolean);}
function arrayText(v){return Array.isArray(v) ? v.join(", ") : (v || "");}
function esc(t){return String(t||"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");}
</script>

</body>
</html>
