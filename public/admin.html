<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NetSearch Admin</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#020817;color:white;min-height:100vh}
.header{padding:22px 40px;background:#0f172a;border-bottom:1px solid #1e293b;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:28px;font-weight:bold;color:#38bdf8}
.btn{padding:10px 15px;border:none;border-radius:10px;background:#2563eb;color:white;cursor:pointer;margin:4px}
.green{background:#16a34a}.yellow{background:#ca8a04}.red{background:#dc2626}.purple{background:#9333ea}.orange{background:#ea580c}
.container{max-width:1250px;margin:auto;padding:35px 20px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:25px}
.card,.section{background:#0f172a;border:1px solid #1e293b;border-radius:18px;padding:22px;margin-bottom:25px}
.card h2{font-size:34px;color:#38bdf8}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
input,textarea,select{width:100%;padding:13px;margin:7px 0;background:#020817;border:1px solid #334155;border-radius:10px;color:white}
.site,.review{background:#111827;border:1px solid #1e293b;border-radius:15px;padding:18px;margin-top:14px}
.siteTop{display:flex;gap:15px;align-items:flex-start}
.siteLogo{width:58px;height:58px;border-radius:14px;object-fit:cover;background:#020817;border:1px solid #334155}
.site h3,.review h3{color:#38bdf8;margin-bottom:8px}
.site p,.review p{color:#cbd5e1;margin:6px 0}
.badge{display:inline-block;padding:5px 10px;border-radius:20px;background:#334155;margin:5px 5px 5px 0;font-size:13px}
.sponsor{background:#9333ea}
.small{color:#94a3b8;font-size:14px;margin-top:10px}
hr{border:none;border-top:1px solid #1e293b;margin:16px 0}
</style>
</head>

<body>

<div class="header">
  <div class="logo">NetSearch Admin</div>
  <div>
    <button class="btn" onclick="location.href='/'">Ana Sayfa</button>
    <button class="btn red" onclick="logout()">Çıkış</button>
  </div>
</div>

<div class="container">

  <div class="cards">
    <div class="card"><h2 id="totalCount">0</h2><p>Toplam Site</p></div>
    <div class="card"><h2 id="pendingCount">0</h2><p>Onay Bekleyen</p></div>
    <div class="card"><h2 id="approvedCount">0</h2><p>Onaylı Site</p></div>
    <div class="card"><h2 id="adCount">0</h2><p>Aktif Reklam</p></div>
    <div class="card"><h2 id="reviewCount">0</h2><p>Toplam Yorum</p></div>
  </div>

  <div class="section">
    <h2>Profesyonel İşletme / Site Ekle</h2>

    <div class="grid">
      <input id="title" placeholder="İşletme / Site Başlığı">
      <input id="url" placeholder="Site Linki">

      <select id="category">
        <option value="Genel">Genel</option>
        <option value="Teknik Servis">Teknik Servis</option>
        <option value="E-Ticaret">E-Ticaret</option>
        <option value="Resmi Kurum">Resmi Kurum</option>
        <option value="Çiçekçi">Çiçekçi</option>
        <option value="Bakkal / Market">Bakkal / Market</option>
        <option value="Restoran">Restoran</option>
        <option value="Sağlık">Sağlık</option>
        <option value="Eğitim">Eğitim</option>
      </select>

      <input id="phone" placeholder="Telefon">
      <input id="city" placeholder="Şehir">
      <input id="district" placeholder="İlçe">
      <input id="logoUrl" placeholder="Logo URL">
      <input id="imageUrl" placeholder="Görsel URL">
    </div>

    <textarea id="address" placeholder="Adres"></textarea>
    <textarea id="keywords" placeholder="Anahtar Kelimeler"></textarea>
    <textarea id="desc" placeholder="Açıklama"></textarea>

    <h3>SEO Bilgileri</h3>
    <input id="seoTitle" placeholder="SEO Başlık">
    <textarea id="seoDescription" placeholder="SEO Açıklama"></textarea>

    <button class="btn green" onclick="addSite()">Siteyi Kaydet</button>
  </div>

  <div class="section">
    <h2>Onay Bekleyen Siteler</h2>
    <div id="pendingSites"></div>
  </div>

  <div class="section">
    <h2>Onaylı Siteler / Reklam ve Kart Yönetimi</h2>
    <div id="approvedSites"></div>
  </div>

  <div class="section">
    <h2>Reddedilen Siteler</h2>
    <div id="rejectedSites"></div>
  </div>

  <div class="section">
    <h2>Yorum Yönetimi</h2>
    <div id="reviewList"></div>
  </div>

</div>

<script>
const user = JSON.parse(localStorage.getItem("user"));

if(!user){
  window.location.href = "/login.html";
}

if(user.role !== "admin"){
  window.location.href = "/";
}

let allSites = [];

function logout(){
  localStorage.removeItem("user");
  window.location.href = "/login.html";
}

function logoFallback(site){
  return site.logoUrl || "https://via.placeholder.com/120x120.png?text=NS";
}

function findSiteName(siteId){
  const site = allSites.find(s => s.id === siteId);
  return site ? site.title : "Bilinmeyen Site";
}

async function loadSites(){
  const res = await fetch("/api/sites");
  const sites = await res.json();

  allSites = sites;

  const pending = sites.filter(s => s.status === "pending");
  const approved = sites.filter(s => s.status === "approved");
  const rejected = sites.filter(s => s.status === "rejected");
  const ads = sites.filter(s => s.adActive === true);

  document.getElementById("totalCount").innerText = sites.length;
  document.getElementById("pendingCount").innerText = pending.length;
  document.getElementById("approvedCount").innerText = approved.length;
  document.getElementById("adCount").innerText = ads.length;

  renderPending(pending);
  renderApproved(approved);
  renderRejected(rejected);

  loadReviews();
}

async function loadReviews(){
  const res = await fetch("/api/reviews");
  const reviews = await res.json();

  document.getElementById("reviewCount").innerText = reviews.length;

  const box = document.getElementById("reviewList");
  box.innerHTML = "";

  if(reviews.length === 0){
    box.innerHTML = "<p class='small'>Henüz yorum yok.</p>";
    return;
  }

  reviews.forEach(review => {
    box.innerHTML += `
      <div class="review">
        <h3>${findSiteName(review.siteId)}</h3>
        <span class="badge">⭐ ${review.rating || 5}</span>
        <span class="badge">${review.userName || "Ziyaretçi"}</span>
        <p><b>Yorum:</b> ${review.comment}</p>
        <p><b>Tarih:</b> ${new Date(review.createdAt).toLocaleString("tr-TR")}</p>
        <button class="btn red" onclick="deleteReview('${review.id}')">Yorumu Sil</button>
      </div>
    `;
  });
}

function siteHeader(site){
  return `
    <div class="siteTop">
      <img class="siteLogo" src="${logoFallback(site)}" onerror="this.src='https://via.placeholder.com/120x120.png?text=NS'">
      <div>
        <h3>${site.title}</h3>
        <span class="badge">${site.category || "Genel"}</span>
        ${site.adActive ? "<span class='badge sponsor'>Sponsorlu</span>" : ""}
        <p><b>Link:</b> ${site.url}</p>
        <p><b>Telefon:</b> ${site.phone || "-"}</p>
        <p><b>Konum:</b> ${site.city || "-"} ${site.district || ""}</p>
      </div>
    </div>
  `;
}

function renderPending(list){
  const box = document.getElementById("pendingSites");
  box.innerHTML = "";

  if(list.length === 0){
    box.innerHTML = "<p class='small'>Onay bekleyen site yok.</p>";
    return;
  }

  list.forEach(site => {
    box.innerHTML += `
      <div class="site">
        ${siteHeader(site)}
        <p><b>Açıklama:</b> ${site.desc}</p>
        <p><b>Anahtar Kelimeler:</b> ${site.keywords}</p>
        <p><b>Ekleyen:</b> ${site.ownerName || "Admin"}</p>
        <button class="btn green" onclick="updateStatus('${site.id}', 'approved')">Onayla</button>
        <button class="btn yellow" onclick="updateStatus('${site.id}', 'rejected')">Reddet</button>
        <button class="btn red" onclick="deleteSite('${site.id}')">Sil</button>
      </div>
    `;
  });
}

function renderApproved(list){
  const box = document.getElementById("approvedSites");
  box.innerHTML = "";

  if(list.length === 0){
    box.innerHTML = "<p class='small'>Onaylı site yok.</p>";
    return;
  }

  list.forEach(site => {
    box.innerHTML += `
      <div class="site">
        ${siteHeader(site)}

        <p><b>Açıklama:</b> ${site.desc}</p>
        <p><b>Adres:</b> ${site.address || "-"}</p>
        <p><b>Anahtar Kelimeler:</b> ${site.keywords}</p>
        <p><b>SEO Başlık:</b> ${site.seoTitle || "-"}</p>
        <p><b>SEO Açıklama:</b> ${site.seoDescription || "-"}</p>
        <p><b>Görüntülenme:</b> ${site.views || 0} | <b>Tıklama:</b> ${site.clicks || 0} | <b>Ücretli Tıklama:</b> ${site.paidClicks || 0}</p>
        <p><b>Bakiye:</b> ${site.balance || 0} TL | <b>CPC:</b> ${site.costPerClick || 0} TL | <b>Günlük Limit:</b> ${site.dailyLimit || 0} TL</p>

        <hr>

        <h3>İşletme Kartı Düzenle</h3>

        <div class="grid">
          <input id="title-${site.id}" value="${site.title || ""}" placeholder="Başlık">
          <input id="url-${site.id}" value="${site.url || ""}" placeholder="URL">
          <input id="category-${site.id}" value="${site.category || ""}" placeholder="Kategori">
          <input id="phone-${site.id}" value="${site.phone || ""}" placeholder="Telefon">
          <input id="city-${site.id}" value="${site.city || ""}" placeholder="Şehir">
          <input id="district-${site.id}" value="${site.district || ""}" placeholder="İlçe">
          <input id="logo-${site.id}" value="${site.logoUrl || ""}" placeholder="Logo URL">
          <input id="image-${site.id}" value="${site.imageUrl || ""}" placeholder="Görsel URL">
        </div>

        <textarea id="address-${site.id}" placeholder="Adres">${site.address || ""}</textarea>
        <textarea id="keywords-${site.id}" placeholder="Anahtar Kelimeler">${site.keywords || ""}</textarea>
        <textarea id="desc-${site.id}" placeholder="Açıklama">${site.desc || ""}</textarea>
        <input id="seoTitle-${site.id}" value="${site.seoTitle || ""}" placeholder="SEO Başlık">
        <textarea id="seoDesc-${site.id}" placeholder="SEO Açıklama">${site.seoDescription || ""}</textarea>

        <button class="btn green" onclick="updateSite('${site.id}')">Kartı Güncelle</button>

        <hr>

        <h3>Reklam Ayarları</h3>

        <div class="grid">
          <input id="balance-${site.id}" type="number" value="${site.balance || 0}" placeholder="Bakiye">
          <input id="cpc-${site.id}" type="number" value="${site.costPerClick || 5}" placeholder="CPC">
          <input id="limit-${site.id}" type="number" value="${site.dailyLimit || 100}" placeholder="Günlük Limit">
          <input id="negative-${site.id}" value="${site.negativeKeywords || ""}" placeholder="Negatif Kelimeler">
        </div>

        <button class="btn purple" onclick="saveAd('${site.id}', true)">Reklamı Aç / Güncelle</button>
        <button class="btn yellow" onclick="saveAd('${site.id}', false)">Reklamı Kapat</button>
        <button class="btn red" onclick="deleteSite('${site.id}')">Sil</button>
      </div>
    `;
  });
}

function renderRejected(list){
  const box = document.getElementById("rejectedSites");
  box.innerHTML = "";

  if(list.length === 0){
    box.innerHTML = "<p class='small'>Reddedilen site yok.</p>";
    return;
  }

  list.forEach(site => {
    box.innerHTML += `
      <div class="site">
        ${siteHeader(site)}
        <p><b>Açıklama:</b> ${site.desc}</p>
        <button class="btn green" onclick="updateStatus('${site.id}', 'approved')">Tekrar Onayla</button>
        <button class="btn red" onclick="deleteSite('${site.id}')">Sil</button>
      </div>
    `;
  });
}

async function addSite(){
  const body = {
    title: document.getElementById("title").value.trim(),
    url: document.getElementById("url").value.trim(),
    category: document.getElementById("category").value.trim(),
    phone: document.getElementById("phone").value.trim(),
    city: document.getElementById("city").value.trim(),
    district: document.getElementById("district").value.trim(),
    logoUrl: document.getElementById("logoUrl").value.trim(),
    imageUrl: document.getElementById("imageUrl").value.trim(),
    address: document.getElementById("address").value.trim(),
    keywords: document.getElementById("keywords").value.trim(),
    desc: document.getElementById("desc").value.trim(),
    seoTitle: document.getElementById("seoTitle").value.trim(),
    seoDescription: document.getElementById("seoDescription").value.trim()
  };

  if(!body.title || !body.url || !body.keywords || !body.desc){
    alert("Başlık, link, anahtar kelime ve açıklama zorunlu.");
    return;
  }

  const res = await fetch("/api/sites", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify(body)
  });

  const data = await res.json();
  alert(data.message || "Kaydedildi.");

  document.querySelectorAll(".section input, .section textarea").forEach(el => {
    if(!el.id.includes("-")) el.value = "";
  });

  loadSites();
}

async function updateSite(id){
  const body = {
    title: document.getElementById(`title-${id}`).value,
    url: document.getElementById(`url-${id}`).value,
    category: document.getElementById(`category-${id}`).value,
    phone: document.getElementById(`phone-${id}`).value,
    city: document.getElementById(`city-${id}`).value,
    district: document.getElementById(`district-${id}`).value,
    logoUrl: document.getElementById(`logo-${id}`).value,
    imageUrl: document.getElementById(`image-${id}`).value,
    address: document.getElementById(`address-${id}`).value,
    keywords: document.getElementById(`keywords-${id}`).value,
    desc: document.getElementById(`desc-${id}`).value,
    seoTitle: document.getElementById(`seoTitle-${id}`).value,
    seoDescription: document.getElementById(`seoDesc-${id}`).value
  };

  const res = await fetch(`/api/sites/${id}`, {
    method:"PUT",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify(body)
  });

  const data = await res.json();
  alert(data.message || "Güncellendi.");
  loadSites();
}

async function updateStatus(id, status){
  await fetch(`/api/sites/${id}/status`, {
    method:"PUT",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({ status })
  });

  loadSites();
}

async function saveAd(id, active){
  const body = {
    adActive: active,
    balance: document.getElementById(`balance-${id}`).value,
    costPerClick: document.getElementById(`cpc-${id}`).value,
    dailyLimit: document.getElementById(`limit-${id}`).value,
    city: document.getElementById(`city-${id}`).value,
    district: document.getElementById(`district-${id}`).value,
    negativeKeywords: document.getElementById(`negative-${id}`).value
  };

  const res = await fetch(`/api/sites/${id}/ad`, {
    method:"PUT",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify(body)
  });

  const data = await res.json();
  alert(data.message || "Güncellendi.");
  loadSites();
}

async function deleteSite(id){
  if(!confirm("Bu site silinsin mi?")) return;

  await fetch(`/api/sites/${id}`, {
    method:"DELETE"
  });

  loadSites();
}

async function deleteReview(id){
  if(!confirm("Bu yorum silinsin mi?")) return;

  const res = await fetch(`/api/reviews/${id}`, {
    method:"DELETE"
  });

  const data = await res.json();
  alert(data.message || "Yorum silindi.");
  loadReviews();
}

loadSites();
</script>

</body>
</html>
