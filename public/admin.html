<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NetSearch Admin</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#020817;
  color:white;
  min-height:100vh;
}

.header{
  background:#0f172a;
  border-bottom:1px solid #1e293b;
  padding:20px 30px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:30px;
  font-weight:bold;
  color:#38bdf8;
}

.btn{
  border:none;
  border-radius:12px;
  padding:12px 18px;
  cursor:pointer;
  color:white;
  font-size:14px;
}

.blue{background:#2563eb}
.green{background:#16a34a}
.red{background:#dc2626}
.yellow{background:#ca8a04}
.purple{background:#9333ea}

.container{
  max-width:1300px;
  margin:auto;
  padding:35px 20px;
}

.section{
  background:#0f172a;
  border:1px solid #1e293b;
  border-radius:24px;
  padding:25px;
  margin-bottom:25px;
}

.section h2{
  margin-bottom:20px;
  color:#38bdf8;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:12px;
}

input,
textarea,
select{
  width:100%;
  padding:14px;
  background:#020817;
  border:1px solid #334155;
  border-radius:12px;
  color:white;
}

textarea{
  min-height:100px;
}

.uploadBox{
  background:#111827;
  border:2px dashed #334155;
  border-radius:18px;
  padding:18px;
  text-align:center;
}

.preview{
  width:120px;
  height:120px;
  border-radius:18px;
  object-fit:cover;
  background:#020817;
  border:1px solid #334155;
  margin:12px auto;
  display:block;
}

.coverPreview{
  width:100%;
  max-width:320px;
  height:170px;
  object-fit:cover;
  border-radius:18px;
  background:#020817;
  border:1px solid #334155;
  margin:12px auto;
  display:block;
}

.siteCard{
  background:#111827;
  border:1px solid #1e293b;
  border-radius:22px;
  overflow:hidden;
  margin-bottom:20px;
}

.siteCover{
  width:100%;
  height:180px;
  object-fit:cover;
  background:#111827;
}

.siteContent{
  padding:22px;
}

.top{
  display:flex;
  gap:18px;
  flex-wrap:wrap;
}

.logoBox{
  width:72px;
  height:72px;
  border-radius:18px;
  overflow:hidden;
  background:linear-gradient(135deg,#0ea5e9,#2563eb);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  font-weight:bold;
}

.logoBox img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.badge{
  display:inline-block;
  padding:6px 12px;
  border-radius:999px;
  background:#1e293b;
  margin-right:8px;
  margin-top:10px;
  color:#38bdf8;
  font-size:13px;
}

.sponsor{
  background:#9333ea;
  color:white;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:20px;
}

.small{
  color:#94a3b8;
  margin-top:10px;
}

@media(max-width:700px){
  .header{
    flex-direction:column;
    gap:14px;
  }
}
</style>
</head>

<body>

<div class="header">

  <div class="logo">
    NetSearch Admin
  </div>

  <div style="display:flex;gap:10px;flex-wrap:wrap">
    <button class="btn blue" onclick="location.href='/'">
      Ana Sayfa
    </button>

    <button class="btn red" onclick="logout()">
      Çıkış
    </button>
  </div>

</div>

<div class="container">

  <!-- SITE ADD -->

  <div class="section">

    <h2>Yeni İşletme / Site Ekle</h2>

    <div class="grid">

      <input id="title" placeholder="İşletme Başlığı">

      <input id="url" placeholder="Site Linki">

      <select id="category">
        <option value="Genel">Genel</option>
        <option value="Teknik Servis">Teknik Servis</option>
        <option value="Çiçekçi">Çiçekçi</option>
        <option value="Bakkal / Market">Bakkal / Market</option>
        <option value="Restoran">Restoran</option>
        <option value="Resmi Kurum">Resmi Kurum</option>
        <option value="Sağlık">Sağlık</option>
        <option value="Eğitim">Eğitim</option>
      </select>

      <input id="phone" placeholder="Telefon">

      <input id="city" placeholder="Şehir">

      <input id="district" placeholder="İlçe">

    </div>

    <textarea id="address" placeholder="Adres"></textarea>

    <textarea id="keywords" placeholder="Anahtar kelimeler"></textarea>

    <textarea id="desc" placeholder="Açıklama"></textarea>

    <!-- LOGO -->

    <div class="uploadBox" style="margin-top:20px">

      <h3>Logo Yükle</h3>

      <img id="logoPreview" class="preview" style="display:none">

      <input
        type="file"
        id="logoFile"
        accept="image/*"
        onchange="uploadLogo()"
      >

      <div class="small" id="logoStatus">
        Logo seçilmedi
      </div>

    </div>

    <!-- COVER -->

    <div class="uploadBox" style="margin-top:20px">

      <h3>Kapak Görseli Yükle (İsteğe Bağlı)</h3>

      <img id="coverPreview" class="coverPreview" style="display:none">

      <input
        type="file"
        id="coverFile"
        accept="image/*"
        onchange="uploadCover()"
      >

      <div class="small" id="coverStatus">
        Görsel seçilmedi
      </div>

    </div>

    <input id="seoTitle" placeholder="SEO Başlık" style="margin-top:20px">

    <textarea id="seoDescription" placeholder="SEO Açıklama"></textarea>

    <button class="btn green" onclick="addSite()">
      Siteyi Kaydet
    </button>

  </div>

  <!-- SITE LIST -->

  <div class="section">

    <h2>Siteler</h2>

    <div id="siteList"></div>

  </div>

</div>

<script>
const user = JSON.parse(localStorage.getItem("user"));

if(!user){
  location.href = "/login.html";
}

if(user.role !== "admin"){
  location.href = "/";
}

let logoUrl = "";
let imageUrl = "";

function logout(){
  localStorage.removeItem("user");
  location.href = "/";
}

async function uploadImage(file){

  const formData = new FormData();

  formData.append("image", file);

  const res = await fetch("/api/upload", {
    method:"POST",
    body:formData
  });

  return await res.json();
}

async function uploadLogo(){

  const file =
    document.getElementById("logoFile").files[0];

  if(!file) return;

  document.getElementById("logoStatus")
    .innerText = "Logo yükleniyor...";

  const data = await uploadImage(file);

  if(data.success){

    logoUrl = data.url;

    const preview =
      document.getElementById("logoPreview");

    preview.src = data.url;
    preview.style.display = "block";

    document.getElementById("logoStatus")
      .innerText = "Logo yüklendi ✅";

  }else{

    document.getElementById("logoStatus")
      .innerText = data.message || "Hata oluştu";
  }
}

async function uploadCover(){

  const file =
    document.getElementById("coverFile").files[0];

  if(!file) return;

  document.getElementById("coverStatus")
    .innerText = "Görsel yükleniyor...";

  const data = await uploadImage(file);

  if(data.success){

    imageUrl = data.url;

    const preview =
      document.getElementById("coverPreview");

    preview.src = data.url;
    preview.style.display = "block";

    document.getElementById("coverStatus")
      .innerText = "Görsel yüklendi ✅";

  }else{

    document.getElementById("coverStatus")
      .innerText = data.message || "Hata oluştu";
  }
}

async function addSite(){

  const body = {
    title:document.getElementById("title").value.trim(),
    url:document.getElementById("url").value.trim(),
    category:document.getElementById("category").value,
    phone:document.getElementById("phone").value.trim(),
    city:document.getElementById("city").value.trim(),
    district:document.getElementById("district").value.trim(),
    address:document.getElementById("address").value.trim(),
    keywords:document.getElementById("keywords").value.trim(),
    desc:document.getElementById("desc").value.trim(),
    logoUrl,
    imageUrl,
    seoTitle:document.getElementById("seoTitle").value.trim(),
    seoDescription:document.getElementById("seoDescription").value.trim()
  };

  if(
    !body.title ||
    !body.url ||
    !body.keywords ||
    !body.desc
  ){
    alert("Başlık, link, anahtar kelime ve açıklama zorunlu.");
    return;
  }

  const res = await fetch("/api/sites", {
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },
    body:JSON.stringify(body)
  });

  const data = await res.json();

  alert(data.message || "Kaydedildi.");

  location.reload();
}

function letterLogo(title){
  return (title || "N")
    .charAt(0)
    .toUpperCase();
}

async function loadSites(){

  const res = await fetch("/api/sites");

  const sites = await res.json();

  const box =
    document.getElementById("siteList");

  box.innerHTML = "";

  if(sites.length === 0){

    box.innerHTML = `
      <div class="small">
        Henüz site yok.
      </div>
    `;

    return;
  }

  sites.forEach(site => {

    const showCover =
      site.imageUrl &&
      site.imageUrl.trim() !== "";

    box.innerHTML += `

      <div class="siteCard">

        ${
          showCover
          ? `
            <img
              class="siteCover"
              src="${site.imageUrl}"
            >
          `
          : ""
        }

        <div class="siteContent">

          <div class="top">

            <div class="logoBox">

              ${
                site.logoUrl
                ? `<img src="${site.logoUrl}">`
                : letterLogo(site.title)
              }

            </div>

            <div>

              <h2 style="color:#38bdf8">
                ${site.title}
              </h2>

              <div style="margin-top:10px">

                <span class="badge">
                  ${site.category || "Genel"}
                </span>

                ${
                  site.adActive
                  ? `<span class="badge sponsor">Sponsorlu</span>`
                  : `<span class="badge">Organik</span>`
                }

                ${
                  site.city
                  ? `<span class="badge">📍 ${site.city}</span>`
                  : ""
                }

              </div>

            </div>

          </div>

          <div class="small">
            ${site.desc || ""}
          </div>

          <div class="actions">

            <a
              class="btn blue"
              href="/site.html?id=${site.id}"
              target="_blank"
            >
              Detay Sayfası
            </a>

            <a
              class="btn green"
              href="${site.url}"
              target="_blank"
            >
              Siteye Git
            </a>

            <button
              class="btn red"
              onclick="deleteSite('${site.id}')"
            >
              Sil
            </button>

          </div>

        </div>

      </div>

    `;
  });
}

async function deleteSite(id){

  if(!confirm("Bu site silinsin mi?")) return;

  await fetch(`/api/sites/${id}`, {
    method:"DELETE"
  });

  loadSites();
}

loadSites();
</script>

</body>
</html>
