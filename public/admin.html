<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NetSearch Admin Panel</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#eef6ff;
  color:#0f172a;
}
header{
  background:linear-gradient(135deg,#0ea5e9,#2563eb);
  color:white;
  padding:22px;
}
.wrap{max-width:1200px;margin:auto;padding:20px}
.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}
h1{margin:0;font-size:30px}
button,a{
  border:0;
  border-radius:12px;
  padding:10px 14px;
  font-weight:bold;
  cursor:pointer;
  text-decoration:none;
}
.logout{background:white;color:#2563eb}
.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:14px;
  margin:20px 0;
}
.stat{
  background:white;
  border:1px solid #dbeafe;
  border-radius:18px;
  padding:18px;
  box-shadow:0 10px 30px rgba(15,23,42,.06);
}
.stat b{font-size:30px;color:#0284c7;display:block}
.panel{
  background:white;
  border:1px solid #dbeafe;
  border-radius:22px;
  padding:18px;
  margin-bottom:20px;
  box-shadow:0 12px 35px rgba(15,23,42,.07);
}
.panel h2{margin-top:0;color:#0284c7}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:12px;
}
input,select,textarea{
  width:100%;
  padding:13px;
  border:1px solid #cbd5e1;
  border-radius:12px;
  font-size:14px;
  outline:none;
}
textarea{min-height:80px;resize:vertical}
.save{background:#16a34a;color:white}
.clear{background:#64748b;color:white}
.edit{background:#2563eb;color:white}
.delete{background:#dc2626;color:white}
.sponsor{background:#f59e0b;color:white}
.list{
  display:grid;
  gap:14px;
}
.card{
  background:#f8fbff;
  border:1px solid #dbeafe;
  border-radius:18px;
  padding:16px;
}
.cardTop{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:flex-start;
}
.card h3{
  margin:0 0 6px;
  color:#0284c7;
}
.url{
  color:#16a34a;
  word-break:break-all;
  font-weight:bold;
  font-size:14px;
}
.desc{color:#475569;line-height:1.5}
.badges{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:10px 0;
}
.badge{
  background:white;
  border:1px solid #bae6fd;
  color:#0369a1;
  border-radius:999px;
  padding:7px 10px;
  font-size:12px;
  font-weight:bold;
}
.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:12px;
}
.msg{
  text-align:center;
  font-weight:bold;
  margin:10px 0;
}
.ok{color:#16a34a}
.err{color:#dc2626}
@media(max-width:700px){
  .top,.cardTop{flex-direction:column}
  .actions button{width:100%}
}
</style>
</head>

<body>

<header>
  <div class="wrap top">
    <h1>NetSearch Admin Panel</h1>
    <a class="logout" href="/index.html">Siteye Dön</a>
  </div>
</header>

<div class="wrap">

  <div class="stats">
    <div class="stat"><b id="totalSites">0</b>Toplam Site</div>
    <div class="stat"><b id="approvedSites">0</b>Onaylı Site</div>
    <div class="stat"><b id="pendingSites">0</b>Bekleyen</div>
    <div class="stat"><b id="activeAds">0</b>Aktif Reklam</div>
    <div class="stat"><b id="totalComments">0</b>Yorum</div>
  </div>

  <div class="panel">
    <h2 id="formTitle">Yeni İşletme / Site Ekle</h2>

    <input type="hidden" id="siteId">

    <div class="grid">
      <input id="title" placeholder="İşletme Başlığı">
      <input id="url" placeholder="Site Linki https://...">
      <select id="category">
        <option>Genel</option>
        <option>Teknik Servis</option>
        <option>Restoran</option>
        <option>Market</option>
        <option>Sağlık</option>
        <option>Eğitim</option>
        <option>Resmi Kurum</option>
      </select>
      <input id="phone" placeholder="Telefon">
      <input id="whatsapp" placeholder="WhatsApp">
      <input id="city" placeholder="Şehir">
      <input id="district" placeholder="İlçe">
      <input id="ownerEmail" placeholder="İşletme Sahibi E-posta">
    </div>

    <br>

    <textarea id="address" placeholder="Adres"></textarea>
    <br><br>
    <textarea id="description" placeholder="Açıklama"></textarea>
    <br><br>
    <textarea id="keywords" placeholder="Anahtar kelimeler: kombi servisi, beyaz eşya, Eskişehir"></textarea>
    <br><br>
    <textarea id="negativeKeywords" placeholder="Negatif anahtar kelimeler: ücretsiz, iş ilanı"></textarea>

    <br><br>

    <div class="grid">
      <input id="logo" placeholder="Logo URL">
      <input id="cover" placeholder="Kapak Görseli URL">
      <input id="gallery" placeholder="Galeri URL'leri virgülle">
      <input id="seoTitle" placeholder="SEO Başlık">
      <input id="seoDesc" placeholder="SEO Açıklama">
    </div>

    <br>

    <div class="grid">
      <select id="approved">
        <option value="true">Onaylı</option>
        <option value="false">Onay Bekliyor</option>
      </select>

      <select id="sponsored">
        <option value="false">Organik</option>
        <option value="true">Sponsorlu</option>
      </select>

      <input id="sponsorBudget" type="number" placeholder="Reklam Bütçesi">
      <input id="cpc" type="number" placeholder="Tıklama Başı Maliyet">
      <input id="dailyLimit" type="number" placeholder="Günlük Limit">
      <input id="aiScore" type="number" placeholder="AI Skor" value="10">
    </div>

    <br>

    <button class="save" onclick="saveSite()">Kaydet</button>
    <button class="clear" onclick="clearForm()">Temizle</button>

    <div id="message" class="msg"></div>
  </div>

  <div class="panel">
    <h2>Site Listesi</h2>
    <div id="siteList" class="list"></div>
  </div>

</div>

<script>
const API = "";

document.addEventListener("DOMContentLoaded", () => {
  loadStats();
  loadSites();
});

function msg(text,type="ok"){
  const el=document.getElementById("message");
  el.className="msg " + type;
  el.innerText=text;
  setTimeout(()=>el.innerText="",3000);
}

async function loadStats(){
  try{
    const res=await fetch(`${API}/api/admin/stats?t=${Date.now()}`,{cache:"no-store"});
    const s=await res.json();

    document.getElementById("totalSites").innerText=s.totalSites || 0;
    document.getElementById("approvedSites").innerText=s.approvedSites || 0;
    document.getElementById("pendingSites").innerText=s.pendingSites || 0;
    document.getElementById("activeAds").innerText=s.activeAds || 0;
    document.getElementById("totalComments").innerText=s.totalComments || 0;
  }catch{
    msg("İstatistikler alınamadı","err");
  }
}

async function loadSites(){
  const box=document.getElementById("siteList");
  box.innerHTML="Yükleniyor...";

  try{
    const res=await fetch(`${API}/api/admin/sites?t=${Date.now()}`,{cache:"no-store"});
    const sites=await res.json();

    box.innerHTML="";

    if(!Array.isArray(sites) || sites.length===0){
      box.innerHTML="<div class='msg'>Kayıtlı site yok.</div>";
      return;
    }

    sites.forEach(site=>{
      const title=site.title || site.name || site.businessName || "İsimsiz";
      const url=site.url || site.website || site.link || "";
      const desc=site.description || site.desc || site.address || "";
      const city=site.city || site.sehir || "";
      const district=site.district || site.ilce || "";
      const approved=site.approved !== false;
      const sponsored=site.sponsored || site.isSponsored || site.sponsorActive;

      const div=document.createElement("div");
      div.className="card";
      div.innerHTML=`
        <div class="cardTop">
          <div>
            <h3>${escapeHtml(title)}</h3>
            <div class="url">${escapeHtml(url)}</div>
          </div>
          <div>
            <b>${approved ? "Onaylı" : "Bekliyor"}</b>
          </div>
        </div>

        <p class="desc">${escapeHtml(desc)}</p>

        <div class="badges">
          <span class="badge">${escapeHtml(site.category || "Genel")}</span>
          ${city ? `<span class="badge">📍 ${escapeHtml(city)} ${district ? "/ "+escapeHtml(district) : ""}</span>` : ""}
          ${sponsored ? `<span class="badge">Sponsorlu</span>` : `<span class="badge">Organik</span>`}
          <span class="badge">Görüntüleme: ${site.views || 0}</span>
          <span class="badge">Tıklama: ${site.clicks || 0}</span>
          <span class="badge">Bütçe: ${site.sponsorBudget || 0}</span>
        </div>

        <div class="actions">
          <button class="edit" onclick='editSite(${JSON.stringify(site).replaceAll("'","&#039;")})'>Düzenle</button>
          <button class="sponsor" onclick="toggleSponsor('${site._id}', ${sponsored ? "false" : "true"})">
            ${sponsored ? "Reklamı Kapat" : "Reklamı Aç"}
          </button>
          <button class="delete" onclick="deleteSite('${site._id}')">Sil</button>
        </div>
      `;
      box.appendChild(div);
    });

  }catch(err){
    console.log(err);
    box.innerHTML="<div class='msg err'>Sunucuya bağlanılamadı.</div>";
  }
}

function getPayload(){
  return {
    title: val("title"),
    name: val("title"),
    businessName: val("title"),
    url: val("url"),
    website: val("url"),
    link: val("url"),
    category: val("category"),
    phone: val("phone"),
    telefon: val("phone"),
    whatsapp: val("whatsapp"),
    city: val("city"),
    sehir: val("city"),
    district: val("district"),
    ilce: val("district"),
    ownerEmail: val("ownerEmail"),
    address: val("address"),
    description: val("description"),
    desc: val("description"),
    keywords: val("keywords"),
    tags: val("keywords"),
    negativeKeywords: val("negativeKeywords"),
    logo: val("logo"),
    logoUrl: val("logo"),
    cover: val("cover"),
    coverUrl: val("cover"),
    gallery: val("gallery").split(",").map(x=>x.trim()).filter(Boolean),
    seoTitle: val("seoTitle"),
    seoDesc: val("seoDesc"),
    approved: val("approved")==="true",
    sponsored: val("sponsored")==="true",
    isSponsored: val("sponsored")==="true",
    sponsorActive: val("sponsored")==="true",
    sponsorBudget: Number(val("sponsorBudget") || 0),
    cpc: Number(val("cpc") || 0),
    sponsorCpc: Number(val("cpc") || 0),
    dailyLimit: Number(val("dailyLimit") || 0),
    aiScore: Number(val("aiScore") || 10)
  };
}

async function saveSite(){
  const id=val("siteId");
  const payload=getPayload();

  if(!payload.title || !payload.url){
    msg("Başlık ve site linki zorunlu.","err");
    return;
  }

  try{
    const res=await fetch(id ? `${API}/api/admin/sites/${id}` : `${API}/api/admin/sites`,{
      method:id ? "PUT" : "POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(payload)
    });

    const data=await res.json();

    if(data.success){
      msg(id ? "Site güncellendi." : "Site eklendi.");
      clearForm();
      loadStats();
      loadSites();
    }else{
      msg(data.message || "İşlem başarısız.","err");
    }
  }catch(err){
    console.log(err);
    msg("Sunucuya bağlanılamadı.","err");
  }
}

function editSite(site){
  document.getElementById("formTitle").innerText="Site Düzenle";
  set("siteId",site._id || "");
  set("title",site.title || site.name || site.businessName || "");
  set("url",site.url || site.website || site.link || "");
  set("category",site.category || "Genel");
  set("phone",site.phone || site.telefon || "");
  set("whatsapp",site.whatsapp || "");
  set("city",site.city || site.sehir || "");
  set("district",site.district || site.ilce || "");
  set("ownerEmail",site.ownerEmail || "");
  set("address",site.address || "");
  set("description",site.description || site.desc || "");
  set("keywords",Array.isArray(site.keywords) ? site.keywords.join(", ") : site.keywords || "");
  set("negativeKeywords",Array.isArray(site.negativeKeywords) ? site.negativeKeywords.join(", ") : site.negativeKeywords || "");
  set("logo",site.logo || site.logoUrl || "");
  set("cover",site.cover || site.coverUrl || "");
  set("gallery",Array.isArray(site.gallery) ? site.gallery.join(", ") : "");
  set("seoTitle",site.seoTitle || "");
  set("seoDesc",site.seoDesc || "");
  set("approved",site.approved === false ? "false" : "true");
  const sp=site.sponsored || site.isSponsored || site.sponsorActive;
  set("sponsored",sp ? "true" : "false");
  set("sponsorBudget",site.sponsorBudget || 0);
  set("cpc",site.cpc || site.sponsorCpc || 0);
  set("dailyLimit",site.dailyLimit || 0);
  set("aiScore",site.aiScore || 10);
  window.scrollTo({top:0,behavior:"smooth"});
}

async function toggleSponsor(id,state){
  try{
    const res=await fetch(`${API}/api/admin/sites/${id}`,{
      method:"PATCH",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        sponsored:state,
        isSponsored:state,
        sponsorActive:state
      })
    });

    const data=await res.json();
    if(data.success){
      loadStats();
      loadSites();
    }else{
      msg("Reklam durumu değişmedi.","err");
    }
  }catch{
    msg("Sunucuya bağlanılamadı.","err");
  }
}

async function deleteSite(id){
  if(!confirm("Bu site silinsin mi?")) return;

  try{
    const res=await fetch(`${API}/api/admin/sites/${id}`,{
      method:"DELETE"
    });

    const data=await res.json();

    if(data.success){
      msg("Site silindi.");
      loadStats();
      loadSites();
    }else{
      msg("Silme başarısız.","err");
    }
  }catch{
    msg("Sunucuya bağlanılamadı.","err");
  }
}

function clearForm(){
  document.getElementById("formTitle").innerText="Yeni İşletme / Site Ekle";
  document.querySelectorAll("input,textarea").forEach(el=>el.value="");
  set("category","Genel");
  set("approved","true");
  set("sponsored","false");
  set("aiScore","10");
}

function val(id){return document.getElementById(id).value}
function set(id,v){document.getElementById(id).value=v}

function escapeHtml(text){
  return String(text || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}
</script>

</body>
</html>
