<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NetSearch Giriş</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#eef5ff;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box{
    width:380px;
    background:white;
    padding:35px;
    border-radius:24px;
    box-shadow:0 10px 40px rgba(0,0,0,0.08);
}

.logo{
    text-align:center;
    font-size:52px;
    font-weight:800;
    margin-bottom:30px;
}

.logo span{
    color:#1da1ff;
}

input{
    width:100%;
    padding:16px;
    margin-bottom:18px;
    border-radius:14px;
    border:1px solid #dbe7ff;
    font-size:16px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:16px;
    border:none;
    border-radius:14px;
    background:linear-gradient(90deg,#1da1ff,#2563eb);
    color:white;
    font-size:18px;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    opacity:.95;
}

#error{
    text-align:center;
    color:red;
    margin-top:15px;
}

.bottom{
    text-align:center;
    margin-top:20px;
}

a{
    color:#1d4ed8;
    text-decoration:none;
    font-weight:bold;
}
</style>
</head>
<body>

<div class="box">

<div class="logo">
Net<span>Search</span>
</div>

<input type="text" id="email" placeholder="Kullanıcı adı veya e-mail">

<input type="password" id="password" placeholder="Şifre">

<button onclick="login()">Giriş Yap</button>

<div id="error"></div>

<div class="bottom">
Hesabın yok mu?
<a href="/register.html">Kayıt Ol</a>
</div>

</div>

<script>

async function login(){

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    document.getElementById("error").innerText = "";

    try{

        const res = await fetch("/api/login",{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                email,
                password
            })
        });

        const data = await res.json();

        if(data.success){

            localStorage.setItem("token",data.token || "ok");
            localStorage.setItem("user",JSON.stringify(data.user || {}));

            if(data.user?.role === "admin"){
                window.location.href="/admin.html";
            }else{
                window.location.href="/user-panel.html";
            }

        }else{
            document.getElementById("error").innerText =
            data.message || "Giriş başarısız";
        }

    }catch(err){

        document.getElementById("error").innerText =
        "Sunucuya bağlanılamadı.";

        console.log(err);
    }
}
</script>

</body>
</html>
