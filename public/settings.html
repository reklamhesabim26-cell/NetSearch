<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NetSearch Ayarlar</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#020817;
color:white;
min-height:100vh;
padding:40px 20px;
}

.container{
max-width:700px;
margin:auto;
background:#0f172a;
padding:40px;
border-radius:25px;
border:1px solid #1e293b;
}

.title{
font-size:42px;
font-weight:bold;
margin-bottom:30px;
color:#38bdf8;
text-align:center;
}

input{
width:100%;
padding:18px;
margin-bottom:18px;
background:#111827;
border:none;
border-radius:12px;
color:white;
font-size:16px;
}

button{
width:100%;
padding:18px;
border:none;
border-radius:12px;
background:linear-gradient(90deg,#00bfff,#2563eb);
color:white;
font-size:18px;
cursor:pointer;
}

.deleteBtn{
margin-top:20px;
background:#dc2626;
}

.msg{
margin-top:20px;
text-align:center;
font-size:18px;
color:#22c55e;
}

.back{
display:block;
text-align:center;
margin-top:25px;
color:#38bdf8;
text-decoration:none;
}

</style>
</head>

<body>

<div class="container">

<div class="title">
Hesap Ayarları
</div>

<input type="text" id="name" placeholder="Ad Soyad">

<input type="text" id="company" placeholder="Firma">

<input type="email" id="email" placeholder="E-posta">

<input type="text" id="phone" placeholder="Telefon">

<input type="text" id="username" placeholder="Kullanıcı Adı">

<input type="password" id="password" placeholder="Yeni Şifre">

<button onclick="saveSettings()">
Bilgileri Güncelle
</button>

<button 
class="deleteBtn"
onclick="deleteAccount()">
Hesabımı Sil
</button>

<div class="msg" id="msg"></div>

<a href="/" class="back">
Ana Sayfaya Dön
</a>

</div>

<script>

const user = JSON.parse(localStorage.getItem("user"));

if(!user){

window.location.href = "/login.html";

}

document.getElementById("name").value = user.name || "";
document.getElementById("company").value = user.company || "";
document.getElementById("email").value = user.email || "";
document.getElementById("phone").value = user.phone || "";
document.getElementById("username").value = user.username || "";

async function saveSettings(){

const updatedUser = {

name:document.getElementById("name").value,
company:document.getElementById("company").value,
email:document.getElementById("email").value,
phone:document.getElementById("phone").value,
username:document.getElementById("username").value,
password:document.getElementById("password").value

};

const res = await fetch(`/api/users/${user.id}`,{

method:"PUT",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify(updatedUser)

});

const data = await res.json();

document.getElementById("msg").innerText = data.message;

const newUser = {

...user,
...updatedUser

};

localStorage.setItem(
"user",
JSON.stringify(newUser)
);

}

async function deleteAccount(){

const confirmDelete = confirm(
"Hesabını silmek istediğine emin misin?"
);

if(!confirmDelete) return;

const res = await fetch(`/api/users/${user.id}`,{

method:"DELETE"

});

const data = await res.json();

alert(data.message);

if(res.ok){

localStorage.removeItem("user");

window.location.href = "/";

}

}

</script>

</body>
</html>
