<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NetSearch Reklam Paneli</title>
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="manifest" href="/manifest.json">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f9ff;color:#0f172a}
header{background:white;border-bottom:1px solid #dbeafe;padding:16px 22px}
.top{max-width:1150px;margin:auto;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:28px;font-weight:900}.logo span{color:#0ea5e9}
.wrap{max-width:1150px;margin:auto;padding:22px}
.panel{background:white;border:1px solid #dbeafe;border-radius:22px;padding:20px;margin-bottom:18px;box-shadow:0 12px 35px rgba(15,23,42,.06)}
h2{margin:0 0 14px;color:#0284c7}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
input,textarea{width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:13px;font-size:15px;margin-bottom:10px}
textarea{min-height:80px}
label{font-weight:bold;font-size:14px;color:#334155}
button,a{border:0;border-radius:12px;padding:12px 16px;font-weight:bold;cursor:pointer;text-decoration:none}
.primary{background:#2563eb;color:white}.green{background:#16a34a;color:white}.dark{background:#0f172a;color:white}.red{background:#dc2626;color:white}.gray{background:#64748b;color:white}
.stat{background:#f8fbff;border:1px solid #dbeafe;border-radius:16px;padding:15px}
.stat b{font-size:26px;color:#0284c7;display:block}
.card{border:1px solid #dbeafe;border-radius:18px;padding:16px;margin-top:12px;background:#f8fbff}
.badge{display:inline-block;border-radius:999px;padding:7px 10px;font-weight:bold;font-size:12px;margin:4px;background:white;border:1px solid #bae6fd;color:#0369a1}
.pending{background:#fef3c7;border-color:#f59e0b;color:#92400e}.active{background:#dcfce7;border-color:#86efac;color:#166534}.rejected{background:#fee2e2;border-color:#fca5a5;color:#991b1b}
.preview{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 14px}
.preview img{width:90px;height:90px;object-fit:cover;border-radius:14px;border:1px solid #dbeafe;background:white}
.msg{text-align:center;font-weight:bold;margin:10px}.ok{color:#16a34a}.err{color:#dc2626}
@media(max-width:700px){.top{flex-direction:column;gap:10px;align-items:flex-start}button,a{width:100%;text-align:center}}
</style>
</head>
<body>

<header>
  <div class="top">
    <div class="logo">Net<span>Search Ads</span></div>
    <div>
      <a class="primary" href="/index.html">Ana Sayfa</a>
      <button class="dark" onclick="logout()">Çıkış Yap</button>
    </div>
  </div>
</header>

<div class="wrap">

  <div class="panel">
    <h2>Reklam Performansı</h2>
    <div class="grid">
      <div class="stat"><b id="totalSites">0</b>Reklam</div>
      <div class="stat"><b id="totalViews">0</b>Görüntüleme</div>
      <div class="stat"><b id="totalClicks">0</b>Tıklama</div>
      <div class="stat"><b id="totalBudget">0₺</b>Bakiye</div>
    </div>
  </div>

  <div class="panel">
    <h2 id="formTitle">Yeni Reklam Oluştur</h2>
    <input type="hidden" id="editingId">
    <input type="hidden" id="logoUrl">
    <input type="hidden" id="coverUrl">
    <input type="hidden" id="galleryUrls">

    <div class="grid">
      <div><label>İşletme Adı</label><input id="businessName" placeholder="Örn: Eskişehir Kombi Servisi"></div>
      <div><label>Web Site</label><input id="website" placeholder="https://siteadresi.com"></div>
      <div><label>Telefon / WhatsApp</label><input id="phone" placeholder="0530..."></div>
    </div>

    <div class="grid">
      <div>
        <label>Logo Yükle</label>
        <input type="file" id="logoFile" accept="image/*" onchange="uploadSingle('logoFile','logoUrl','logoPreview')">
        <div id="logoPreview" class="preview"></div>
      </div>
      <div>
        <label>Kapak Görseli Yükle</label>
        <input type="file" id="coverFile" accept="image/*" onchange="uploadSingle('coverFile','coverUrl','coverPreview')">
        <div id="coverPreview" class="preview"></div>
      </div>
      <div>
        <label>Galeri Görselleri Yükle</label>
        <input type="file" id="galleryFile" accept="image/*" multiple onchange="uploadGallery()">
        <div id="galleryPreview" class="preview"></div>
      </div>
    </div>

    <div class="grid">
      <div><label>Başlık 1</label><input id="h1" placeholder="Eskişehir Kombi Servisi"></div>
      <div><label>Başlık 2</label><input id="h2" placeholder="Aynı Gün Servis"></div>
      <div><label>Başlık 3</label><input id="h3" placeholder="Hemen Ara"></div>
    </div>

    <label>Açıklama 1</label>
    <textarea id="d1" placeholder="İşletme ve reklam açıklaması"></textarea>

    <label>Açıklama 2</label>
    <textarea id="d2" placeholder="Ek açıklama"></textarea>

    <div class="grid">
      <div><label>Hedef Şehir</label><input id="city" placeholder="Eskişehir"></div>
      <div><label>Hedef İlçeler</label><input id="districts" placeholder="Tepebaşı, Odunpazarı"></div>
      <div><label>Kategori</label><input id="category" placeholder="Teknik Servis"></div>
    </div>

    <div class="grid">
      <div><label>Harita Enlem</label><input id="latitude" placeholder="39.7767"></div>
      <div><label>Harita Boylam</label><input id="longitude" placeholder="30.5206"></div>
    </div>

    <label>Anahtar Kelimeler</label>
    <textarea id="keywords" placeholder="kombi servisi, kombi tamircisi, beyaz eşya servisi"></textarea>

    <label>Negatif Anahtar Kelimeler</label>
    <textarea id="negativeKeywords" placeholder="ücretsiz, iş ilanı"></textarea>

    <div class="grid">
      <div><label>Günlük Bütçe ₺</label><input id="dailyLimit" type="number" placeholder="100"></div>
      <div><label>CPC / Tıklama Teklifi ₺</label><input id="cpc" type="number" placeholder="10"></div>
      <div><label>Bakiye ₺</label><input id="budget" type="number" placeholder="500"></div>
    </div>

    <button class="green" onclick="saveAd()">Onaya Gönder / Kaydet</button>
    <button class="gray" onclick="clearForm()">Formu Temizle</button>
    <div id="createMsg" class="msg"></div>
  </div>

  <div class="panel">
    <h2>Reklamlarım</h2>
    <div id="myAds">Yükleniyor...</div>
  </div>

</div>

<script>
let currentUser=null;
let mySites=[];

window.onload=()=>{
  const userRaw=localStorage.getItem("user");
  const token=localStorage.getItem("token");
  if(!token || !userRaw){ location.href="/login.html"; return; }
  currentUser=JSON.parse(userRaw);
  loadAds();
};

function logout(){
  localStorage.removeItem("token");
  localStorage.removeItem("user");
  location.href="/login.html";
}

async function uploadSingle(fileId, hiddenId, previewId){
  const file=document.getElementById(fileId).files[0];
  if(!file) return;

  const fd=new FormData();
  fd.append("file",file);

  const res=await fetch("/api/upload",{method:"POST",body:fd});
  const data=await res.json();

  if(data.success){
    document.getElementById(hiddenId).value=data.url;
    document.getElementById(previewId).innerHTML=`<img src="${data.url}">`;
  }else{
    alert("Görsel yüklenemedi.");
  }
}

async function uploadGallery(){
  const files=document.getElementById("galleryFile").files;
  if(!files.length) return;

  const fd=new FormData();
  [...files].forEach(f=>fd.append("files",f));

  const res=await fetch("/api/upload/multiple",{method:"POST",body:fd});
  const data=await res.json();

  if(data.success){
    document.getElementById("galleryUrls").value=data.urls.join(",");
    document.getElementById("galleryPreview").innerHTML=data.urls.map(u=>`<img src="${u}">`).join("");
  }else{
    alert("Galeri yüklenemedi.");
  }
}

async function loadAds(){
  const box=document.getElementById("myAds");
  box.innerHTML="Yükleniyor...";

  try{
    const res=await fetch("/api/admin/sites?t="+Date.now(),{cache:"no-store"});
    const all=await res.json();

    mySites=all.filter(s=>String(s.ownerEmail||"").toLowerCase()===String(currentUser.email||"").toLowerCase());
    renderStats();
    renderAds();
  }catch{
    box.innerHTML="Sunucuya bağlanılamadı.";
  }
}

function renderStats(){
  let views=0,clicks=0,budget=0;
  mySites.forEach(s=>{
    views+=Number(s.views||0);
    clicks+=Number(s.clicks||0);
    budget+=Number(s.sponsorBudget||0);
  });
  totalSites.innerText=mySites.length;
  totalViews.innerText=views;
  totalClicks.innerText=clicks;
  totalBudget.innerText=budget+"₺";
}

function renderAds(){
  const box=document.getElementById("myAds");
  box.innerHTML="";

  if(!mySites.length){
    box.innerHTML="<p>Henüz reklam oluşturmadın. Yukarıdaki formdan reklamını onaya gönder.</p>";
    return;
  }

  mySites.forEach(s=>{
    const active=s.sponsored||s.isSponsored||s.sponsorActive;
    const pending=s.status==="pending";
    const rejected=s.status==="rejected";

    const div=document.createElement("div");
    div.className="card";
    div.innerHTML=`
      <h3>${esc(s.title||s.businessName||"Reklam")}</h3>
      <div>
        ${pending?'<span class="badge pending">Onay Bekliyor</span>':active?'<span class="badge active">Aktif Reklam</span>':rejected?'<span class="badge rejected">Reddedildi</span>':'<span class="badge">Pasif</span>'}
        <span class="badge">Görüntüleme: ${s.views||0}</span>
        <span class="badge">Tıklama: ${s.clicks||0}</span>
        <span class="badge">Bütçe: ${s.sponsorBudget||0}₺</span>
        <span class="badge">CPC: ${s.cpc||0}₺</span>
        <span class="badge">Kalite: ${s.qualityScore||0}</span>
      </div>
      <div class="preview">
        ${s.logo ? `<img src="${s.logo}">` : ""}
        ${s.cover ? `<img src="${s.cover}">` : ""}
      </div>
      <p>${esc(s.description||"")}</p>
      ${s.rejectReason ? `<p style="color:#dc2626"><b>Red nedeni:</b> ${esc(s.rejectReason)}</p>` : ""}
      <button class="primary" onclick="editAd('${s._id}')">Düzenle</button>
      <button class="red" onclick="deleteAd('${s._id}')">Sil</button>
    `;
    box.appendChild(div);
  });
}

function editAd(id){
  const s=mySites.find(x=>x._id===id);
  if(!s) return;

  formTitle.innerText="Reklamı Düzenle";
  set("editingId",s._id);
  set("businessName",s.title||s.businessName||"");
  set("website",s.url||s.website||"");
  set("phone",s.phone||s.telefon||"");
  set("logoUrl",s.logo||s.logoUrl||"");
  set("coverUrl",s.cover||s.coverUrl||"");
  set("galleryUrls",arrayText(s.gallery));
  set("h1",s.adHeadline1||s.title||"");
  set("h2",s.adHeadline2||"");
  set("h3",s.adHeadline3||"");
  set("d1",s.adDescription1||s.description||"");
  set("d2",s.adDescription2||"");
  set("city",s.city||s.sehir||arrayText(s.targetCities));
  set("districts",arrayText(s.targetDistricts)||s.district||s.ilce||"");
  set("category",s.category||"");
  set("latitude",s.latitude||"");
  set("longitude",s.longitude||"");
  set("keywords",arrayText(s.keywords||s.tags));
  set("negativeKeywords",arrayText(s.negativeKeywords));
  set("dailyLimit",s.dailyLimit||0);
  set("cpc",s.cpc||s.sponsorCpc||0);
  set("budget",s.sponsorBudget||0);

  logoPreview.innerHTML=s.logo ? `<img src="${s.logo}">` : "";
  coverPreview.innerHTML=s.cover ? `<img src="${s.cover}">` : "";
  galleryPreview.innerHTML=Array.isArray(s.gallery) ? s.gallery.map(u=>`<img src="${u}">`).join("") : "";

  window.scrollTo({top:0,behavior:"smooth"});
}

async function saveAd(){
  const msg=document.getElementById("createMsg");
  msg.className="msg";
  msg.innerText="";

  const id=val("editingId");
  const name=val("businessName");
  const url=val("website");
  const phone=val("phone");

  if(!name || !url){
    msg.className="msg err";
    msg.innerText="İşletme adı ve web site zorunlu.";
    return;
  }

  const payload={
    title:name,name,businessName:name,
    url,website:url,link:url,
    phone,telefon:phone,whatsapp:phone,

    logo:val("logoUrl"),
    logoUrl:val("logoUrl"),
    image:val("logoUrl"),
    cover:val("coverUrl"),
    coverUrl:val("coverUrl"),
    gallery:toArray(val("galleryUrls")),

    adHeadline1:val("h1")||name,
    adHeadline2:val("h2"),
    adHeadline3:val("h3"),
    adDescription1:val("d1"),
    adDescription2:val("d2"),
    description:val("d1"),
    desc:val("d1"),

    city:val("city"),
    sehir:val("city"),
    targetCities:toArray(val("city")),
    targetDistricts:toArray(val("districts")),
    category:val("category")||"Genel",

    latitude:Number(val("latitude")||0),
    longitude:Number(val("longitude")||0),

    keywords:val("keywords"),
    tags:val("keywords"),
    negativeKeywords:val("negativeKeywords"),

    dailyLimit:Number(val("dailyLimit")||0),
    cpc:Number(val("cpc")||0),
    sponsorCpc:Number(val("cpc")||0),
    sponsorBudget:Number(val("budget")||0),

    ownerEmail:currentUser.email,

    status:"pending",
    approved:false,
    sponsored:false,
    isSponsored:false,
    sponsorActive:false,
    rejectReason:"",
    adStoppedReason:"Kullanıcı düzenledi, tekrar onay bekliyor"
  };

  try{
    const endpoint=id ? "/api/admin/sites/"+id : "/api/admin/sites";
    const method=id ? "PATCH" : "POST";

    const res=await fetch(endpoint,{
      method,
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(payload)
    });

    const data=await res.json();

    if(data.success){
      msg.className="msg ok";
      msg.innerText=id ? "Reklam güncellendi ve tekrar onaya gönderildi." : "Reklam onaya gönderildi.";
      clearForm();
      loadAds();
    }else{
      msg.className="msg err";
      msg.innerText="İşlem başarısız.";
    }
  }catch{
    msg.className="msg err";
    msg.innerText="Sunucuya bağlanılamadı.";
  }
}

async function deleteAd(id){
  if(!confirm("Reklam silinsin mi?")) return;
  await fetch("/api/admin/sites/"+id,{method:"DELETE"});
  loadAds();
}

function clearForm(){
  formTitle.innerText="Yeni Reklam Oluştur";
  document.querySelectorAll("input,textarea").forEach(x=>{
    if(x.type!=="file") x.value="";
  });
  logoPreview.innerHTML="";
  coverPreview.innerHTML="";
  galleryPreview.innerHTML="";
}

function val(id){return document.getElementById(id).value.trim();}
function set(id,v){document.getElementById(id).value=v||"";}
function toArray(v){return String(v||"").split(",").map(x=>x.trim()).filter(Boolean);}
function arrayText(v){return Array.isArray(v) ? v.join(", ") : (v || "");}
function esc(t){return String(t||"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");}
</script>

</body>
</html>
