<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NetSearch İşletme Paneli</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#eef6ff;
  color:#0f172a;
}

header{
  background:linear-gradient(135deg,#0ea5e9,#2563eb);
  color:white;
  padding:24px;
}

.wrap{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}

h1{margin:0}
a,button{
  border:0;
  border-radius:12px;
  padding:11px 15px;
  font-weight:bold;
  cursor:pointer;
  text-decoration:none;
}

.home{background:white;color:#2563eb}

.panel{
  background:white;
  border:1px solid #dbeafe;
  border-radius:22px;
  padding:18px;
  margin:20px 0;
  box-shadow:0 12px 35px rgba(15,23,42,.07);
}

.panel h2{
  margin-top:0;
  color:#0284c7;
}

.loginBox{
  max-width:480px;
  margin:40px auto;
}

input,textarea,select{
  width:100%;
  padding:14px;
  border:1px solid #cbd5e1;
  border-radius:12px;
  font-size:15px;
  outline:none;
  margin-bottom:12px;
}

textarea{
  min-height:90px;
  resize:vertical;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:14px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
  gap:14px;
}

.stat{
  background:#f8fbff;
  border:1px solid #dbeafe;
  border-radius:18px;
  padding:18px;
}

.stat b{
  display:block;
  font-size:30px;
  color:#0284c7;
}

.card{
  background:#f8fbff;
  border:1px solid #dbeafe;
  border-radius:20px;
  padding:18px;
  margin-bottom:16px;
}

.badges{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin:12px 0;
}

.badge{
  background:white;
  border:1px solid #bae6fd;
  color:#0369a1;
  border-radius:999px;
  padding:8px 12px;
  font-size:13px;
  font-weight:bold;
}

.verified{
  background:#dcfce7;
  border-color:#86efac;
  color:#166534;
}

.ad{
  background:#fef3c7;
  border-color:#f59e0b;
  color:#92400e;
}

.save{background:#16a34a;color:white}
.adbtn{background:#f59e0b;color:white}
.stop{background:#dc2626;color:white}
.pay{background:#2563eb;color:white}
.gray{background:#64748b;color:white}

.msg{
  text-align:center;
  font-weight:bold;
  margin:12px;
}

.ok{color:#16a34a}
.err{color:#dc2626}

.gallery{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.gallery img{
  width:120px;
  height:90px;
  object-fit:cover;
  border-radius:14px;
  border:1px solid #dbeafe;
}

@media(max-width:700px){
  .top{flex-direction:column;align-items:flex-start}
  button,a{width:100%;text-align:center}
}
</style>
</head>

<body>

<header>
  <div class="wrap top">
    <h1>NetSearch İşletme Paneli</h1>
    <a class="home" href="/index.html">Ana Sayfa</a>
  </div>
</header>

<div class="wrap">

  <div id="loginPanel" class="panel loginBox">
    <h2>İşletme Paneline Giriş</h2>
    <input id="email" placeholder="İşletme e-posta adresi">
    <button class="pay" onclick="loginOwner()">Panele Gir</button>
    <div id="loginMsg" class="msg"></div>
  </div>

  <div id="dashboard" style="display:none;">

    <div class="panel">
      <h2>Reklam Performansı</h2>
      <div class="stats">
        <div class="stat"><b id="totalSites">0</b>İşletme</div>
        <div class="stat"><b id="totalViews">0</b>Görüntüleme</div>
        <div class="stat"><b id="totalClicks">0</b>Tıklama</div>
        <div class="stat"><b id="avgCtr">0%</b>CTR</div>
        <div class="stat"><b id="totalBudget">0₺</b>Reklam Bakiyesi</div>
      </div>
    </div>

    <div class="panel">
      <h2>Ödeme / Bakiye Yükleme</h2>
      <p>Demo ödeme sistemi: gerçek ödeme entegrasyonu eklenince burada kart/iyzico/PayTR ödeme ekranı çalışacak.</p>
      <div class="grid">
        <input id="paymentAmount" type="number" placeholder="Yüklenecek bakiye ₺">
        <select id="paymentMethod">
          <option>Kredi Kartı</option>
          <option>Havale / EFT</option>
          <option>PayTR</option>
          <option>iyzico</option>
        </select>
      </div>
      <button class="pay" onclick="fakePayment()">Bakiye Yükle</button>
      <div id="paymentMsg" class="msg"></div>
    </div>

    <div class="panel">
      <h2>İşletmelerim ve Reklamlarım</h2>
      <div id="siteList"></div>
    </div>

  </div>

</div>

<script>
const API = "";
let ownerEmail = "";
let ownerSites = [];

function loginOwner(){
  ownerEmail = document.getElementById("email").value.trim();

  if(!ownerEmail){
    document.getElementById("loginMsg").innerHTML = "<span class='err'>E-posta gir.</span>";
    return;
  }

  localStorage.setItem("ownerEmail", ownerEmail);
  document.getElementById("loginPanel").style.display = "none";
  document.getElementById("dashboard").style.display = "block";
  loadOwnerSites();
}

window.onload = function(){
  const saved = localStorage.getItem("ownerEmail");
  if(saved){
    document.getElementById("email").value = saved;
    ownerEmail = saved;
    document.getElementById("loginPanel").style.display = "none";
    document.getElementById("dashboard").style.display = "block";
    loadOwnerSites();
  }
}

async function loadOwnerSites(){
  const box = document.getElementById("siteList");
  box.innerHTML = "Yükleniyor...";

  try{
    const res = await fetch(`/api/admin/sites?t=${Date.now()}`, {cache:"no-store"});
    const allSites = await res.json();

    ownerSites = allSites.filter(site => {
      return String(site.ownerEmail || "").toLowerCase() === ownerEmail.toLowerCase();
    });

    renderStats();
    renderSites();

  }catch(err){
    box.innerHTML = "<div class='msg err'>Sunucuya bağlanılamadı.</div>";
  }
}

function renderStats(){
  let views = 0;
  let clicks = 0;
  let budget = 0;

  ownerSites.forEach(site => {
    views += Number(site.views || 0);
    clicks += Number(site.clicks || 0);
    budget += Number(site.sponsorBudget || 0);
  });

  const ctr = views > 0 ? ((clicks / views) * 100).toFixed(1) : 0;

  document.getElementById("totalSites").innerText = ownerSites.length;
  document.getElementById("totalViews").innerText = views;
  document.getElementById("totalClicks").innerText = clicks;
  document.getElementById("avgCtr").innerText = ctr + "%";
  document.getElementById("totalBudget").innerText = budget + "₺";
}

function renderSites(){
  const box = document.getElementById("siteList");
  box.innerHTML = "";

  if(ownerSites.length === 0){
    box.innerHTML = `
      <div class="msg err">
        Bu e-posta adresine bağlı işletme bulunamadı.
        Admin panelinden işletmeye ownerEmail ekle.
      </div>
    `;
    return;
  }

  ownerSites.forEach(site => {
    const sponsored = site.sponsored || site.isSponsored || site.sponsorActive;
    const verified = site.verified || site.isVerified;
    const gallery = Array.isArray(site.gallery) ? site.gallery : [];

    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `
      <h2>${escapeHtml(site.title || site.name || site.businessName || "İsimsiz İşletme")}</h2>
      <p>${escapeHtml(site.description || site.desc || "")}</p>

      <div class="badges">
        ${verified ? `<span class="badge verified">Doğrulanmış İşletme</span>` : `<span class="badge">Doğrulama Bekliyor</span>`}
        ${sponsored ? `<span class="badge ad">Sponsorlu Reklam Aktif</span>` : `<span class="badge">Organik</span>`}
        <span class="badge">Görüntüleme: ${site.views || 0}</span>
        <span class="badge">Tıklama: ${site.clicks || 0}</span>
        <span class="badge">Bütçe: ${site.sponsorBudget || 0}₺</span>
        <span class="badge">CPC: ${site.cpc || site.sponsorCpc || 0}₺</span>
      </div>

      <div class="grid">
        <input id="title-${site._id}" value="${escapeAttr(site.title || site.name || "")}" placeholder="Reklam Başlığı">
        <input id="url-${site._id}" value="${escapeAttr(site.url || site.website || site.link || "")}" placeholder="Site Linki">
        <input id="budget-${site._id}" type="number" value="${site.sponsorBudget || 0}" placeholder="Reklam Bütçesi">
        <input id="cpc-${site._id}" type="number" value="${site.cpc || site.sponsorCpc || 0}" placeholder="Tıklama Başı Maliyet">
      </div>

      <textarea id="keywords-${site._id}" placeholder="Anahtar kelimeler">${arrayText(site.keywords || site.tags)}</textarea>
      <textarea id="negative-${site._id}" placeholder="Negatif anahtar kelimeler">${arrayText(site.negativeKeywords)}</textarea>

      <div class="gallery">
        ${gallery.map(img => `<img src="${escapeHtml(img)}">`).join("")}
      </div>

      <br>

      <button class="save" onclick="saveAd('${site._id}')">Reklam Ayarlarını Kaydet</button>
      <button class="${sponsored ? "stop" : "adbtn"}" onclick="toggleAd('${site._id}', ${sponsored ? "false" : "true"})">
        ${sponsored ? "Reklamı Durdur" : "Reklamı Başlat"}
      </button>
    `;

    box.appendChild(div);
  });
}

async function saveAd(id){
  const payload = {
    title: val(`title-${id}`),
    name: val(`title-${id}`),
    businessName: val(`title-${id}`),
    url: val(`url-${id}`),
    website: val(`url-${id}`),
    link: val(`url-${id}`),
    sponsorBudget: Number(val(`budget-${id}`) || 0),
    cpc: Number(val(`cpc-${id}`) || 0),
    sponsorCpc: Number(val(`cpc-${id}`) || 0),
    keywords: val(`keywords-${id}`),
    tags: val(`keywords-${id}`),
    negativeKeywords: val(`negative-${id}`)
  };

  try{
    const res = await fetch(`/api/admin/sites/${id}`,{
      method:"PATCH",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(payload)
    });

    const data = await res.json();

    if(data.success){
      alert("Reklam ayarları güncellendi.");
      loadOwnerSites();
    }else{
      alert("Güncelleme başarısız.");
    }
  }catch{
    alert("Sunucuya bağlanılamadı.");
  }
}

async function toggleAd(id,state){
  try{
    const res = await fetch(`/api/admin/sites/${id}`,{
      method:"PATCH",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        sponsored: state,
        isSponsored: state,
        sponsorActive: state
      })
    });

    const data = await res.json();

    if(data.success){
      loadOwnerSites();
    }else{
      alert("Reklam durumu değişmedi.");
    }
  }catch{
    alert("Sunucuya bağlanılamadı.");
  }
}

async function fakePayment(){
  const amount = Number(document.getElementById("paymentAmount").value || 0);

  if(amount <= 0){
    document.getElementById("paymentMsg").innerHTML = "<span class='err'>Tutar gir.</span>";
    return;
  }

  if(ownerSites.length === 0){
    document.getElementById("paymentMsg").innerHTML = "<span class='err'>Bağlı işletme yok.</span>";
    return;
  }

  const firstSite = ownerSites[0];
  const newBudget = Number(firstSite.sponsorBudget || 0) + amount;

  try{
    await fetch(`/api/admin/sites/${firstSite._id}`,{
      method:"PATCH",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        sponsorBudget: newBudget
      })
    });

    document.getElementById("paymentMsg").innerHTML = "<span class='ok'>Demo bakiye yüklendi.</span>";
    document.getElementById("paymentAmount").value = "";
    loadOwnerSites();

  }catch{
    document.getElementById("paymentMsg").innerHTML = "<span class='err'>Ödeme işlenemedi.</span>";
  }
}

function val(id){return document.getElementById(id).value}

function arrayText(v){
  if(Array.isArray(v)) return v.join(", ");
  return v || "";
}

function escapeHtml(text){
  return String(text || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function escapeAttr(text){
  return String(text || "")
    .replaceAll("&","&amp;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}
</script>

</body>
</html>
